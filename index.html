<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇬🇳 Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px 18px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .logo {
      text-align: center;
      font-size: 45px;
    }

    h1 {
      text-align: center;
      color: #087f5b;
    }

    h2 {
      text-align: center;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.5;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #login {
      background: #1864ab;
    }

    #logout {
      background: #c92a2a;
    }

    .role-button {
      background: #f1f3f5;
      color: #222;
      border: 2px solid #ddd;
    }

    .welcome {
      background: #e6fcf5;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      margin: 20px 0;
    }

    .role {
      font-size: 20px;
      font-weight: bold;
      margin: 12px 0;
    }

    #dashboard,
    #roleChoice,
    #projectsSection,
    #addProjectSection {
      display: none;
    }

    .project {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 16px;
      margin: 12px 0;
      background: #fafafa;
    }

    .project h3 {
      margin-top: 0;
      color: #087f5b;
    }

    .sector {
      display: inline-block;
      background: #e6fcf5;
      color: #087f5b;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .small {
      color: #777;
      font-size: 14px;
    }

    #message,
    #roleMessage,
    #projectMessage {
      text-align: center;
      font-weight: bold;
      margin-top: 12px;
      min-height: 22px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- CONNEXION -->
  <div id="auth" class="card">

    <div class="logo">🇬🇳</div>

    <h1>Guinée Invest Hub</h1>

    <p class="description">
      Connectons les investisseurs aux projets guinéens.
    </p>

    <h2>Créer un compte</h2>

    <input id="email" type="email" placeholder="Votre adresse e-mail">

    <input id="password" type="password" placeholder="Votre mot de passe">

    <button id="signup" type="button">
      Créer mon compte
    </button>

    <button id="login" type="button">
      Se connecter
    </button>

    <p id="message"></p>

  </div>


  <!-- CHOIX DU PROFIL -->
  <div id="roleChoice" class="card">

    <div class="logo">👤</div>

    <h1>Votre profil</h1>

    <p class="description">
      Choisissez votre type de compte.
    </p>

    <button id="investisseur" class="role-button" type="button">
      💰 Investisseur
    </button>

    <button id="porteur" class="role-button" type="button">
      🚀 Porteur de projet
    </button>

    <p id="roleMessage"></p>

  </div>


  <!-- TABLEAU DE BORD -->
  <div id="dashboard" class="card">

    <div class="logo">🇬🇳</div>

    <h1>Guinée Invest Hub</h1>

    <div class="welcome">

      <h2>✅ Bienvenue !</h2>

      <p id="userEmail"></p>

      <div class="role" id="userRole"></div>

    </div>

    <button id="showProjects" type="button">
      📊 Voir les projets
    </button>

    <button id="showAddProject" type="button">
      ➕ Ajouter un projet
    </button>

    <button id="logout" type="button">
      Se déconnecter
    </button>

  </div>


  <!-- PROJETS -->
  <div id="projectsSection" class="card">

    <h2>📊 Projets d'investissement</h2>

    <div id="projectsList">
      Chargement des projets...
    </div>

  </div>


  <!-- AJOUTER UN PROJET -->
  <div id="addProjectSection" class="card">

    <h2>➕ Ajouter un projet</h2>

    <input
      id="projectTitle"
      type="text"
      placeholder="Nom du projet"
    >

    <textarea
      id="projectDescription"
      placeholder="Description du projet"
    ></textarea>

    <input
      id="projectSector"
      type="text"
      placeholder="Secteur : agriculture, immobilier..."
    >

    <button id="addProject" type="button">
      Publier le projet
    </button>

    <p id="projectMessage"></p>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://phwnkvglvebbajixwjau.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_...";

const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const message =
  document.getElementById("message");

const auth =
  document.getElementById("auth");

const roleChoice =
  document.getElementById("roleChoice");

const dashboard =
  document.getElementById("dashboard");

const projectsSection =
  document.getElementById("projectsSection");

const addProjectSection =
  document.getElementById("addProjectSection");

const userEmail =
  document.getElementById("userEmail");

const userRole =
  document.getElementById("userRole");

const roleMessage =
  document.getElementById("roleMessage");

const projectMessage =
  document.getElementById("projectMessage");

let currentUser = null;


/* =========================
   CREATION DU COMPTE
========================= */

document.getElementById("signup").onclick =
async function() {

  message.textContent =
    "⏳ Création du compte...";

  const e =
    email.value.trim();

  const p =
    password.value;

  if (!e || !p) {

    message.textContent =
      "❌ Remplis les deux champs.";

    return;
  }

  if (p.length < 6) {

    message.textContent =
      "❌ Mot de passe : 6 caractères minimum.";

    return;
  }

  try {

    const result =
      await client.auth.signUp({
        email: e,
        password: p
      });

    if (result.error) {

      message.textContent =
        "❌ " + result.error.message;

      return;
    }

    if (result.data.user) {

      currentUser =
        result.data.user;

      message.textContent =
        "✅ Compte créé !";

      setTimeout(
        afficherChoixRole,
        500
      );
    }

  } catch(error) {

    message.textContent =
      "❌ " + error.message;
  }
};


/* =========================
   CONNEXION
========================= */

document.getElementById("login").onclick =
async function() {

  message.textContent =
    "⏳ Connexion...";

  try {

    const result =
      await client.auth.signInWithPassword({

        email:
          email.value.trim(),

        password:
          password.value
      });

    if (result.error) {

      message.textContent =
        "❌ " + result.error.message;

      return;
    }

    currentUser =
      result.data.user;

    await chargerProfil(
      currentUser
    );

  } catch(error) {

    message.textContent =
      "❌ " + error.message;
  }
};


/* =========================
   CHOIX PROFIL
========================= */

function afficherChoixRole() {

  auth.style.display =
    "none";

  dashboard.style.display =
    "none";

  projectsSection.style.display =
    "none";

  addProjectSection.style.display =
    "none";

  roleChoice.style.display =
    "block";
}


document.getElementById("investisseur").onclick =
async function() {

  await enregistrerRole(
    "investisseur"
  );
};


document.getElementById("porteur").onclick =
async function() {

  await enregistrerRole(
    "porteur_projet"
  );
};


/* =========================
   ENREGISTRER LE ROLE
========================= */

async function enregistrerRole(role) {

  roleMessage.textContent =
    "⏳ Enregistrement...";

  if (!currentUser) {

    roleMessage.textContent =
      "❌ Utilisateur introuvable.";

    return;
  }

  try {

    const result =
      await client
        .from("profiles")
        .upsert({
          id:
            currentUser.id,

          role:
            role
        });

    if (result.error) {

      roleMessage.textContent =
        "❌ " +
        result.error.message;

      return;
    }

    afficherDashboardAvecRole(
      currentUser,
      role
    );

  } catch(error) {

    roleMessage.textContent =
      "❌ " +
      error.message;
  }
}


/* =========================
   CHARGER LE PROFIL
========================= */

async function chargerProfil(user) {

  try {

    const result =
      await client
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();

    if (
      result.data &&
      result.data.role
    ) {

      afficherDashboardAvecRole(
        user,
        result.data.role
      );

    } else {

      afficherChoixRole();
    }

  } catch(error) {

    afficherChoixRole();
  }
}


/* =========================
   TABLEAU DE BORD
========================= */

function afficherDashboardAvecRole(
  user,
  role
) {

  auth.style.display =
    "none";

  roleChoice.style.display =
    "none";

  projectsSection.style.display =
    "none";

  addProjectSection.style.display =
    "none";

  dashboard.style.display =
    "block";

  userEmail.textContent =
    "Connecté : " +
    user.email;

  if (
    role === "investisseur"
  ) {

    userRole.textContent =
      "💰 Investisseur";

  } else {

    userRole.textContent =
      "🚀 Porteur de projet";
  }
}


/* =========================
   AFFICHER LES PROJETS
========================= */

document.getElementById("showProjects").onclick =
async function() {

  addProjectSection.style.display =
    "none";

  projectsSection.style.display =
    "block";

  await chargerProjets();
};


/* =========================
   CHARGER LES PROJETS
========================= */

async function chargerProjets() {

  const list =
    document.getElementById(
      "projectsList"
    );

  list.innerHTML =
    "⏳ Chargement...";

  try {

    const result =
      await client
        .from("projects")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (result.error) {

      list.innerHTML =
        "❌ " +
        result.error.message;

      return;
    }

    if (
      !result.data ||
      result.data.length === 0
    ) {

      list.innerHTML =
        "<p>Aucun projet pour le moment.</p>";

      return;
    }

    list.innerHTML = "";

    result.data.forEach(
      function(project) {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "project";

        div.innerHTML = `

          <h3>
            ${project.title || "Projet sans nom"}
          </h3>

          <span class="sector">
            ${project.sector || "Secteur non précisé"}
          </span>

          <p>
            ${project.description || "Aucune description."}
          </p>

        `;

        list.appendChild(div);
      }
    );

  } catch(error) {

    list.innerHTML =
      "❌ " +
      error.message;
  }
}


/* =========================
   AJOUTER UN PROJET
========================= */

document.getElementById("showAddProject").onclick =
function() {

  projectsSection.style.display =
    "none";

  addProjectSection.style.display =
    "block";
};


document.getElementById("addProject").onclick =
async function() {

  projectMessage.textContent =
    "⏳ Publication...";

  const title =
    document
      .getElementById("projectTitle")
      .value
      .trim();

  const description =
    document
      .getElementById("projectDescription")
      .value
      .trim();

  const sector =
    document
      .getElementById("projectSector")
      .value
      .trim();

  if (!title) {

    projectMessage.textContent =
      "❌ Ajoute un nom au projet.";

    return;
  }

  try {

    const result =
      await client
        .from("projects")
        .insert({

          id:
            crypto.randomUUID(),

          title:
            title,

          description:
            description,

          sector:
            sector

        });

    if (result.error) {

      projectMessage.textContent =
        "❌ " +
        result.error.message;

      return;
    }

    projectMessage.textContent =
      "✅ Projet publié !";

    document
      .getElementById("projectTitle")
      .value = "";

    document
      .getElementById("projectDescription")
      .value = "";

    document
      .getElementById("projectSector")
      .value = "";

  } catch(error) {

    projectMessage.textContent =
      "❌ " +
      error.message;
  }
};


/* =========================
   DECONNEXION
========================= */

document.getElementById("logout").onclick =
async function() {

  await client.auth.signOut();

  currentUser = null;

  dashboard.style.display =
    "none";

  roleChoice.style.display =
    "none";

  projectsSection.style.display =
    "none";

  addProjectSection.style.display =
    "none";

  auth.style.display =
    "block";

  email.value = "";

  password.value = "";
};


/* =========================
   VERIFIER LA CONNEXION
========================= */

async function verifierConnexion() {

  try {

    const result =
      await client.auth.getSession();

    if (
      result.data.session
    ) {

      currentUser =
        result.data.session.user;

      await chargerProfil(
        currentUser
      );
    }

  } catch(error) {

    console.log(error);
  }
}


verifierConnexion();

</script>

</body>
</html>
