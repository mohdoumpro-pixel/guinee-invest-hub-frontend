<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #0b5d3b, #087f5b);
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    .container {
      width: min(1100px, 94%);
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .hidden {
      display: none !important;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d7dde5;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      background: #087f5b;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin: 5px 0;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      background: #c62828;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .stat {
      background: #f0f8f5;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      color: #087f5b;
      margin-top: 5px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .project {
      border: 1px solid #e2e7ed;
      border-radius: 14px;
      padding: 18px;
      background: #fff;
    }

    .project h3 {
      margin-top: 0;
      color: #087f5b;
    }

    .sector {
      display: inline-block;
      background: #e8f5ef;
      color: #087f5b;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .amount {
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    .interest {
      background: #f59f00;
      width: 100%;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin: 12px 0;
      display: none;
    }

    .success {
      display: block;
      background: #dff5e8;
      color: #146c43;
    }

    .error {
      display: block;
      background: #fde2e2;
      color: #a61e1e;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #697386;
    }

    .interest-project {
      border-left: 4px solid #087f5b;
      padding: 15px;
      margin-bottom: 12px;
      background: #f7faf9;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🇬🇳 Guinée Invest Hub</h1>
  <p>Connecter les investisseurs aux projets guinéens</p>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <!-- CONNEXION -->
  <div id="authCard" class="card">
    <h2>💰 Espace Investisseur</h2>

    <input
      type="email"
      id="email"
      placeholder="Votre adresse email"
    >

    <input
      type="password"
      id="password"
      placeholder="Votre mot de passe"
    >

    <button id="loginBtn">
      🔐 Se connecter
    </button>

    <button id="signupBtn">
      📝 Créer un compte
    </button>
  </div>

  <!-- ESPACE INVESTISSEUR -->
  <div id="investorSpace" class="hidden">

    <div class="card">
      <h2>💰 Espace Investisseur</h2>

      <p id="userEmail"></p>

      <button id="logoutBtn" class="logout">
        🚪 Se déconnecter
      </button>
    </div>

    <!-- STATISTIQUES -->
    <div class="card">
      <h2>📊 Tableau de bord</h2>

      <div class="stats">

        <div class="stat">
          Projets disponibles
          <strong id="projectCount">0</strong>
        </div>

        <div class="stat">
          Mes intérêts
          <strong id="interestCount">0</strong>
        </div>

      </div>
    </div>

    <!-- MES INTÉRÊTS -->
    <div class="card">
      <h2>❤️ Mes intérêts</h2>

      <div id="myInterests">
        <p class="empty">Chargement...</p>
      </div>
    </div>

    <!-- PROJETS -->
    <div class="card">
      <h2>🚀 Projets disponibles</h2>

      <input
        type="text"
        id="search"
        placeholder="🔎 Rechercher un projet..."
      >

      <div id="projects" class="projects">
        <p class="empty">Chargement des projets...</p>
      </div>
    </div>

  </div>

</div>

<script>

  /* =====================================================
     SUPABASE
  ===================================================== */

  const SUPABASE_URL =
    "https://phwnkvglvebbajixwjau.supabase.co";

  /*
    ⚠️ GARDE TA CLÉ PUBLISHABLE EXISTANTE ICI.
    NE METS PAS LA SECRET KEY.
  */

  const SUPABASE_KEY =
    "sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK";

  const sb =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================================
     VARIABLES
  ===================================================== */

  let currentUser = null;
  let projects = [];


  /* =====================================================
     MESSAGE
  ===================================================== */

  function showMessage(text, type) {

    const box =
      document.getElementById("message");

    box.textContent = text;

    box.className =
      "message " + type;

    setTimeout(() => {
      box.className = "message";
    }, 5000);
  }


  /* =====================================================
     FORMAT ARGENT
  ===================================================== */

  function formatMoney(value) {

    const number =
      Number(value || 0);

    return number.toLocaleString("fr-FR") + " GNF";
  }


  /* =====================================================
     CONNEXION
  ===================================================== */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      showMessage(
        "Veuillez remplir tous les champs.",
        "error"
      );

      return;
    }

    const { error } =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }

    showMessage(
      "✅ Connexion réussie.",
      "success"
    );
  }


  /* =====================================================
     CRÉATION COMPTE
  ===================================================== */

  async function signup() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      showMessage(
        "Veuillez remplir tous les champs.",
        "error"
      );

      return;
    }

    const { data, error } =
      await sb.auth.signUp({
        email,
        password
      });

    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }

    if (data.user) {

      await sb
        .from("profiles")
        .upsert({
          id: data.user.id,
          role: "investor"
        });
    }

    showMessage(
      "✅ Compte créé avec succès.",
      "success"
    );
  }


  /* =====================================================
     CHARGER L'UTILISATEUR
  ===================================================== */

  async function loadUser() {

    const { data } =
      await sb.auth.getUser();

    currentUser =
      data?.user || null;

    const authCard =
      document.getElementById("authCard");

    const investorSpace =
      document.getElementById("investorSpace");

    if (!currentUser) {

      authCard.classList.remove("hidden");
      investorSpace.classList.add("hidden");

      return;
    }

    authCard.classList.add("hidden");
    investorSpace.classList.remove("hidden");

    document.getElementById("userEmail").textContent =
      "Connecté : " + currentUser.email;

    await loadProjects();
    await loadInterestCount();
    await loadMyInterests();
  }


  /* =====================================================
     CHARGER LES PROJETS
     
     IMPORTANT :
     LE FILTRE STATUS = APPROVED A ÉTÉ SUPPRIMÉ.
  ===================================================== */

  async function loadProjects() {

    const container =
      document.getElementById("projects");

    container.innerHTML =
      "<p class='empty'>Chargement des projets...</p>";

    const {
      data,
      error
    } = await sb
      .from("projects")
      .select(
        "id,title,description,sector,amount,amount_required,status"
      )
      .order(
        "title",
        {
          ascending: true
        }
      );

    if (error) {

      console.error(error);

      container.innerHTML =
        "<p class='empty'>Impossible de charger les projets.</p>";

      document.getElementById(
        "projectCount"
      ).textContent = "0";

      return;
    }

    projects =
      data || [];

    document.getElementById(
      "projectCount"
    ).textContent =
      projects.length;

    displayProjects(projects);
  }


  /* =====================================================
     AFFICHER LES PROJETS
  ===================================================== */

  function displayProjects(list) {

    const container =
      document.getElementById("projects");

    if (!list.length) {

      container.innerHTML =
        "<p class='empty'>Aucun projet disponible pour le moment.</p>";

      return;
    }

    container.innerHTML =
      list.map(project => `

        <div class="project">

          <span class="sector">
            ${project.sector || "Projet"}
          </span>

          <h3>
            ${project.title || "Projet sans titre"}
          </h3>

          <p>
            ${project.description || "Aucune description disponible."}
          </p>

          <div class="amount">
            ${formatMoney(
              project.amount_required ??
              project.amount
            )}
          </div>

          <button
            class="interest"
            onclick="registerInterest('${project.id}')"
          >
            ❤️ Je suis intéressé
          </button>

        </div>

      `).join("");
  }


  /* =====================================================
     ENREGISTRER UN INTÉRÊT
  ===================================================== */

  async function registerInterest(projectId) {

    if (!currentUser) {

      showMessage(
        "Vous devez être connecté.",
        "error"
      );

      return;
    }

    const project =
      projects.find(
        p => p.id === projectId
      );

    if (!project) {

      showMessage(
        "Projet introuvable.",
        "error"
      );

      return;
    }

    const {
      data: existing,
      error: checkError
    } = await sb
      .from("interests")
      .select("id")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "project_id",
        projectId
      )
      .maybeSingle();

    if (checkError) {

      showMessage(
        "Erreur lors de la vérification.",
        "error"
      );

      return;
    }

    if (existing) {

      showMessage(
        "Vous êtes déjà intéressé par ce projet.",
        "success"
      );

      return;
    }

    const { error } =
      await sb
        .from("interests")
        .insert({
          user_id: currentUser.id,
          project_id: projectId
        });

    if (error) {

      showMessage(
        "Impossible d'enregistrer votre intérêt.",
        "error"
      );

      return;
    }

    showMessage(
      "✅ Votre intérêt a été enregistré.",
      "success"
    );

    await loadInterestCount();
    await loadMyInterests();
  }


  /* =====================================================
     COMPTER LES INTÉRÊTS
  ===================================================== */

  async function loadInterestCount() {

    if (!currentUser) return;

    const {
      count,
      error
    } = await sb
      .from("interests")
      .select(
        "*",
        {
          count: "exact",
          head: true
        }
      )
      .eq(
        "user_id",
        currentUser.id
      );

    if (!error) {

      document.getElementById(
        "interestCount"
      ).textContent =
        count || 0;
    }
  }


  /* =====================================================
     MES INTÉRÊTS
  ===================================================== */

  async function loadMyInterests() {

    const container =
      document.getElementById("myInterests");

    container.innerHTML =
      "<p class='empty'>Chargement...</p>";

    if (!currentUser) {

      container.innerHTML =
        "<p class='empty'>Connectez-vous pour voir vos intérêts.</p>";

      return;
    }

    const {
      data,
      error
    } = await sb
      .from("interests")
      .select(
        "id, project_id, created_at"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );

    if (error) {

      console.error(error);

      container.innerHTML =
        "<p class='empty'>Impossible de charger vos intérêts.</p>";

      return;
    }

    if (!data || !data.length) {

      container.innerHTML =
        "<p class='empty'>Vous n'avez encore aucun projet dans vos intérêts.</p>";

      return;
    }

    container.innerHTML =
      data.map(item => {

        const project =
          projects.find(
            p => p.id === item.project_id
          );

        if (!project) {

          return `
            <div class="interest-project">
              <strong>Projet associé</strong>
              <p>Ce projet n'est plus disponible.</p>
            </div>
          `;
        }

        return `
          <div class="interest-project">

            <strong>
              ${project.title}
            </strong>

            <p>
              ${project.sector || "Projet"}
            </p>

            <strong>
              ${formatMoney(
                project.amount_required ??
                project.amount
              )}
            </strong>

          </div>
        `;

      }).join("");
  }


  /* =====================================================
     RECHERCHE
  ===================================================== */

  document
    .getElementById("search")
    .addEventListener(
      "input",
      function() {

        const search =
          this.value
            .toLowerCase()
            .trim();

        const filtered =
          projects.filter(project => {

            return (
              (project.title || "")
                .toLowerCase()
                .includes(search)

              ||

              (project.description || "")
                .toLowerCase()
                .includes(search)

              ||

              (project.sector || "")
                .toLowerCase()
                .includes(search)
            );
          });

        displayProjects(filtered);
      }
    );


  /* =====================================================
     DÉCONNEXION
  ===================================================== */

  async function logout() {

    await sb.auth.signOut();

    showMessage(
      "Vous êtes déconnecté.",
      "success"
    );
  }


  /* =====================================================
     BOUTONS
  ===================================================== */

  document
    .getElementById("loginBtn")
    .addEventListener(
      "click",
      login
    );

  document
    .getElementById("signupBtn")
    .addEventListener(
      "click",
      signup
    );

  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      logout
    );


  /* =====================================================
     AUTH STATE
  ===================================================== */

  sb.auth.onAuthStateChange(
    async (event, session) => {

      currentUser =
        session?.user || null;

      if (
        event === "SIGNED_IN" ||
        event === "SIGNED_OUT"
      ) {

        await loadUser();
      }
    }
  );


  /* =====================================================
     DÉMARRAGE
  ===================================================== */

  loadUser();

</script>

</body>
</html>
