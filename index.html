<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇬🇳 Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #17221d;
    }

    header {
      background: #087f3e;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .stat strong {
      display: block;
      font-size: 22px;
      color: #087f3e;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .project {
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .project h3 {
      margin-top: 0;
    }

    .sector {
      display: inline-block;
      background: #e8f7ef;
      color: #087f3e;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .amount {
      font-weight: bold;
      font-size: 18px;
      margin: 12px 0;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 15px;
      margin-right: 8px;
      margin-top: 8px;
    }

    .primary {
      background: #087f3e;
      color: white;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .danger {
      background: #b42318;
      color: white;
    }

    .message {
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      background: #e8f7ef;
      color: #087f3e;
    }

    .error {
      background: #fdecec;
      color: #b42318;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🇬🇳 Guinée Invest Hub</h1>
  <p>Espace Investisseur</p>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <div class="card">
    <h2>💰 Espace Investisseur</h2>
    <p id="userInfo">Connexion en cours...</p>
    <button id="logoutBtn" class="danger">Déconnexion</button>
  </div>

  <div class="stats">
    <div class="stat">
      <strong id="projectCount">0</strong>
      Projets
    </div>

    <div class="stat">
      <strong>🇬🇳</strong>
      Guinée
    </div>

    <div class="stat">
      <strong id="interestCount">0</strong>
      Mes intérêts
    </div>
  </div>

  <div class="card">
    <h2>🔎 Rechercher un projet</h2>
    <input
      type="text"
      id="searchInput"
      placeholder="Rechercher agriculture, immobilier..."
    >
  </div>
<div class="card">
  <h2>❤️ Mes intérêts</h2>
  <div id="myInterests">
    Chargement...
  </div>
</div>
  <div class="card">
    <h2>🚀 Projets disponibles</h2>
    <div id="projectsList"></div>
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://phwnkvglvebbajixwjau.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;

const projects = [
  {
    id: "11111111-1111-4111-8111-111111111111",
    title: "Ferme agricole moderne",
    description: "Projet agricole moderne destiné à produire et commercialiser des produits agricoles.",
    sector: "Agriculture",
    amount: 500000000
  },
  {
    id: "22222222-2222-4222-8222-222222222222",
    title: "Unité de transformation alimentaire",
    description: "Unité destinée à transformer et valoriser les produits agricoles locaux.",
    sector: "Agroalimentaire",
    amount: 800000000
  },
  {
    id: "33333333-3333-4333-8333-333333333333",
    title: "Production d'eau potable",
    description: "Projet de production et distribution d'eau potable en Guinée.",
    sector: "Industrie",
    amount: 1000000000
  },
  {
    id: "44444444-4444-4444-8444-444444444444",
    title: "Résidence immobilière",
    description: "Projet immobilier destiné à développer des logements modernes.",
    sector: "Immobilier",
    amount: 2500000000
  },
  {
    id: "55555555-5555-4555-8555-555555555555",
    title: "Énergie solaire",
    description: "Projet de production et distribution d'énergie solaire.",
    sector: "Énergie",
    amount: 750000000
  },
  {
    id: "66666666-6666-4666-8666-666666666666",
    title: "Transport et logistique",
    description: "Projet de transport et de logistique pour les entreprises.",
    sector: "Transport",
    amount: 600000000
  }
];

function showMessage(text, type) {
  const box = document.getElementById("message");

  box.textContent = text;
  box.className = "message " + type;
  box.style.display = "block";

  setTimeout(() => {
    box.style.display = "none";
  }, 5000);
}

function formatMoney(amount) {
  return new Intl.NumberFormat("fr-FR").format(amount) + " GNF";
}

function displayProjects(list) {
  const container = document.getElementById("projectsList");

  container.innerHTML = "";

  if (list.length === 0) {
    container.innerHTML =
      "<p>Aucun projet trouvé.</p>";
    return;
  }

  list.forEach(project => {

    const div = document.createElement("div");

    div.className = "project";

    div.innerHTML = `
      <span class="sector">${project.sector}</span>

      <h3>${project.title}</h3>

      <p>${project.description}</p>

      <div class="amount">
        💰 ${formatMoney(project.amount)}
      </div>

      <button
        class="primary interestBtn"
        data-id="${project.id}"
      >
        💰 Je suis intéressé
      </button>

      <button
        class="secondary detailsBtn"
        data-id="${project.id}"
      >
        👁️ Voir détails
      </button>
    `;

    container.appendChild(div);
  });

  document
    .querySelectorAll(".interestBtn")
    .forEach(button => {
      button.addEventListener(
        "click",
        () => registerInterest(button.dataset.id)
      );
    });

  document
    .querySelectorAll(".detailsBtn")
    .forEach(button => {
      button.addEventListener(
        "click",
        () => showDetails(button.dataset.id)
      );
    });
}

function showDetails(projectId) {

  const project =
    projects.find(p => p.id === projectId);

  if (!project) return;

  alert(
    project.title +
    "\n\n" +
    project.description +
    "\n\nSecteur : " +
    project.sector +
    "\nMontant : " +
    formatMoney(project.amount)
  );
}

async function registerInterest(projectId) {

  if (!currentUser) {
    showMessage(
      "Vous devez être connecté.",
      "error"
    );
    return;
  }

  const project =
    projects.find(p => p.id === projectId);

  if (!project) {
    showMessage(
      "Projet introuvable.",
      "error"
    );
    return;
  }

  const { data: existing, error: checkError } =
    await sb
      .from("interests")
      .select("id")
      .eq("user_id", currentUser.id)
      .eq("project_id", projectId)
      .maybeSingle();

  if (checkError) {
    showMessage(
      "Erreur lors de la vérification.",
      "error"
    );
    return;
  }

  if (existing) {
    showMessage(
      "Vous êtes déjà intéressé par ce projet.",
      "success"
    );
    return;
  }

  const { error } =
    await sb
      .from("interests")
      .insert({
        user_id: currentUser.id,
        project_id: projectId
      });

  if (error) {
    console.error(error);

    showMessage(
      "Impossible d'enregistrer votre intérêt.",
      "error"
    );

    return;
  }

  showMessage(
    "✅ Votre intérêt pour " +
    project.title +
    " a été enregistré.",
    "success"
  );

  loadInterestCount();
}
async function loadMyInterests() {
  const container = document.getElementById("myInterests");

  const { data, error } = await sb
    .from("interests")
    .select("project_id, created_at")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: false });

  if (error) {
    container.innerHTML = "<p>Impossible de charger vos intérêts.</p>";
    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML = "<p>Vous n’avez encore manifesté aucun intérêt.</p>";
    return;
  }

  container.innerHTML = data.map(item => {
    const project = projects.find(p => p.id === item.project_id);

    if (!project) return "";

    return `
      <div class="project">
        <span class="sector">${project.sector}</span>
        <h3>${project.title}</h3>
        <p>${project.description}</p>
        <div class="amount">💰 ${formatMoney(project.amount)}</div>
        <p>✅ Intérêt enregistré</p>
      </div>
    `;
  }).join("");
}
async function loadInterestCount() {

  if (!currentUser) return;

  const { count, error } =
    await sb
      .from("interests")
      .select("*", {
        count: "exact",
        head: true
      })
      .eq("user_id", currentUser.id);

  if (!error) {
    document.getElementById(
      "interestCount"
    ).textContent = count || 0;
  }
}

async function logout() {

  await sb.auth.signOut();

  window.location.reload();
}

document
  .getElementById("logoutBtn")
  .addEventListener("click", logout);

document
  .getElementById("searchInput")
  .addEventListener("input", function() {

    const search =
      this.value.toLowerCase().trim();

    const filtered =
      projects.filter(project =>
        project.title.toLowerCase().includes(search) ||
        project.description.toLowerCase().includes(search) ||
        project.sector.toLowerCase().includes(search)
      );

    displayProjects(filtered);
  });

async function init() {

  const {
    data: {
      session
    }
  } = await sb.auth.getSession();

  if (!session) {

    document.getElementById(
      "userInfo"
    ).textContent =
      "Vous n'êtes pas connecté.";

    return;
  }

  currentUser = session.user;

  document.getElementById(
    "userInfo"
  ).textContent =
    "Vous êtes connecté comme Investisseur";

  document.getElementById(
    "projectCount"
  ).textContent = projects.length;

  displayProjects(projects);

  await loadInterestCount();
}

init();
</script>

</body>
</html>
