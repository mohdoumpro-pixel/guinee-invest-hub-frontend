<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #0b6b43;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
    }

    header p {
      margin-top: 7px;
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    h2 {
      margin-bottom: 15px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin: 8px 0 12px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 15px;
      background: #0b6b43;
      color: white;
      margin: 4px;
    }

    .danger {
      background: #c62828;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: #0b6b43;
      margin-top: 8px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .project {
      border: 1px solid #e1e6eb;
      border-radius: 12px;
      padding: 17px;
      background: white;
    }

    .project h3 {
      margin: 9px 0;
    }

    .sector {
      display: inline-block;
      background: #e8f5ee;
      color: #0b6b43;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .amount {
      font-weight: bold;
      margin: 12px 0;
    }

    .message {
      padding: 13px;
      border-radius: 9px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      display: block;
      background: #e7f7ed;
      color: #176b3b;
    }

    .error {
      display: block;
      background: #fdeaea;
      color: #a52222;
    }

    .empty {
      color: #777;
      padding: 10px 0;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {
      .stats,
      .projects {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🇬🇳 Guinée Invest Hub</h1>
  <p>Investir dans les projets guinéens</p>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <!-- CONNEXION -->
  <div id="authCard" class="card">

    <h2>🔐 Connexion</h2>

    <input
      type="email"
      id="email"
      placeholder="Votre adresse email"
    >

    <input
      type="password"
      id="password"
      placeholder="Votre mot de passe"
    >

    <select id="role">
      <option value="investisseur">Investisseur</option>
      <option value="porteur">Porteur de projet</option>
    </select>

    <button id="loginBtn">
      Se connecter
    </button>

    <button id="signupBtn">
      Créer un compte
    </button>

  </div>


  <!-- ESPACE INVESTISSEUR -->
  <div id="investorSpace" class="hidden">

    <div class="card">

      <h2>💰 Espace Investisseur</h2>

      <p id="userEmail"></p>

      <button id="logoutBtn" class="danger">
        🚪 Déconnexion
      </button>

    </div>


    <!-- STATISTIQUES -->
    <div class="stats">

      <div class="stat">
        🚀 Projets disponibles
        <strong id="projectCount">0</strong>
      </div>

      <div class="stat">
        ❤️ Mes intérêts
        <strong id="interestCount">0</strong>
      </div>

      <div class="stat">
        🇬🇳 Marché
        <strong>Guinée</strong>
      </div>

    </div>


    <!-- RECHERCHE -->
    <div class="card">

      <h2>🔎 Rechercher un projet</h2>

      <input
        type="text"
        id="searchInput"
        placeholder="Nom, secteur..."
      >

    </div>


    <!-- MES INTÉRÊTS -->
    <div class="card">

      <h2>❤️ Mes intérêts</h2>

      <div id="myInterests">
        Chargement...
      </div>

    </div>


    <!-- PROJETS -->
    <div class="card">

      <h2>🚀 Projets disponibles</h2>

      <div id="projects">
        Chargement...
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  "https://phwnkvglvebbajixwjau.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   VARIABLES
===================================== */

let currentUser = null;

let projects = [];


/* =====================================
   MESSAGE
===================================== */

function showMessage(text, type = "success") {

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  setTimeout(() => {

    box.className = "message";

  }, 5000);
}


/* =====================================
   FORMAT ARGENT
===================================== */

function formatMoney(amount) {

  return new Intl.NumberFormat(
    "fr-FR"
  ).format(Number(amount) || 0) + " GNF";

}


/* =====================================
   CHARGER LES PROJETS SUPABASE
===================================== */

async function loadProjects() {

  const container =
    document.getElementById("projects");

  container.innerHTML =
    "<p class='empty'>Chargement des projets...</p>";


  const {
    data,
    error
  } = await sb
    .from("projects")
    .select(
      "id,title,description,sector,amount,status"
    )
    .eq(
      "status",
      "approved"
    )
    .order(
      "title",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    container.innerHTML =
      "<p class='empty'>Impossible de charger les projets.</p>";

    document.getElementById(
      "projectCount"
    ).textContent = "0";

    return;

  }


  projects =
    data || [];


  document.getElementById(
    "projectCount"
  ).textContent =
    projects.length;


  displayProjects(projects);

}


/* =====================================
   AFFICHER LES PROJETS
===================================== */

function displayProjects(list) {

  const container =
    document.getElementById("projects");


  if (!list || list.length === 0) {

    container.innerHTML =
      "<p class='empty'>Aucun projet approuvé pour le moment.</p>";

    return;

  }


  container.innerHTML = `

    <div class="projects">

      ${list.map(project => `

        <div class="project">

          <span class="sector">
            ${project.sector || "Projet"}
          </span>

          <h3>
            ${project.title || "Projet sans titre"}
          </h3>

          <p>
            ${project.description || "Aucune description disponible."}
          </p>

          <div class="amount">
            💰 ${formatMoney(project.amount)}
          </div>

          <button
            onclick="registerInterest('${project.id}')"
          >
            ❤️ Je suis intéressé
          </button>

        </div>

      `).join("")}

    </div>

  `;

}


/* =====================================
   ENREGISTRER UN INTÉRÊT
===================================== */

async function registerInterest(projectId) {

  if (!currentUser) {

    showMessage(
      "Vous devez être connecté.",
      "error"
    );

    return;

  }


  const project =
    projects.find(
      p => p.id === projectId
    );


  if (!project) {

    showMessage(
      "Projet introuvable.",
      "error"
    );

    return;

  }


  const {
    data: existing,
    error: checkError
  } = await sb
    .from("interests")
    .select("id")
    .eq(
      "user_id",
      currentUser.id
    )
    .eq(
      "project_id",
      projectId
    )
    .maybeSingle();


  if (checkError) {

    console.error(checkError);

    showMessage(
      "Erreur lors de la vérification.",
      "error"
    );

    return;

  }


  if (existing) {

    showMessage(
      "Vous êtes déjà intéressé par ce projet.",
      "success"
    );

    return;

  }


  const {
    error
  } = await sb
    .from("interests")
    .insert({

      user_id:
        currentUser.id,

      project_id:
        projectId

    });


  if (error) {

    console.error(error);

    showMessage(
      "Impossible d'enregistrer votre intérêt.",
      "error"
    );

    return;

  }


  showMessage(
    "✅ Votre intérêt a été enregistré.",
    "success"
  );


  await loadInterestCount();

  await loadMyInterests();

}


/* =====================================
   COMPTEUR INTÉRÊTS
===================================== */

async function loadInterestCount() {

  if (!currentUser) {

    document.getElementById(
      "interestCount"
    ).textContent = "0";

    return;

  }


  const {
    count,
    error
  } = await sb
    .from("interests")
    .select(
      "*",
      {
        count: "exact",
        head: true
      }
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if (error) {

    console.error(error);

    return;

  }


  document.getElementById(
    "interestCount"
  ).textContent =
    count || 0;

}


/* =====================================
   MES INTÉRÊTS
===================================== */

async function loadMyInterests() {

  const container =
    document.getElementById(
      "myInterests"
    );


  if (!container) return;


  if (!currentUser) {

    container.innerHTML =
      "<p class='empty'>Connexion en cours...</p>";

    return;

  }


  container.innerHTML =
    "<p class='empty'>Chargement...</p>";


  const {
    data,
    error
  } = await sb
    .from("interests")
    .select(
      "project_id,created_at"
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (error) {

    console.error(error);

    container.innerHTML =
      "<p class='empty'>Impossible de charger vos intérêts.</p>";

    return;

  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p class='empty'>Vous n’avez encore manifesté aucun intérêt.</p>";

    return;

  }


  const cards =
    data.map(item => {

      const project =
        projects.find(
          p =>
            p.id === item.project_id
        );


      if (!project) return "";


      return `

        <div class="project">

          <span class="sector">
            ${project.sector || "Projet"}
          </span>

          <h3>
            ${project.title}
          </h3>

          <p>
            ${project.description || ""}
          </p>

          <div class="amount">
            💰 ${formatMoney(project.amount)}
          </div>

          <p>
            ✅ Intérêt enregistré
          </p>

        </div>

      `;

    }).join("");


  if (!cards) {

    container.innerHTML =
      "<p class='empty'>Les projets associés ne sont plus disponibles.</p>";

    return;

  }


  container.innerHTML =
    `<div class="projects">${cards}</div>`;

}


/* =====================================
   INSCRIPTION
===================================== */

async function signup() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  const role =
    document.getElementById(
      "role"
    ).value;


  if (!email || !password) {

    showMessage(
      "Veuillez remplir tous les champs.",
      "error"
    );

    return;

  }


  if (password.length < 6) {

    showMessage(
      "Le mot de passe doit contenir au moins 6 caractères.",
      "error"
    );

    return;

  }


  const {
    data,
    error
  } =
    await sb.auth.signUp({

      email,
      password

    });


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;

  }


  if (!data.user) {

    showMessage(
      "Compte créé.",
      "success"
    );

    return;

  }


  const {
    error: profileError
  } =
    await sb
      .from("profiles")
      .upsert({

        id:
          data.user.id,

        role:
          role

      });


  if (profileError) {

    console.error(
      profileError
    );

  }


  showMessage(
    "✅ Compte créé avec succès.",
    "success"
  );


  await loadUser();

}


/* =====================================
   CONNEXION
===================================== */

async function login() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;


  if (!email || !password) {

    showMessage(
      "Veuillez remplir tous les champs.",
      "error"
    );

    return;

  }


  const {
    data,
    error
  } =
    await sb.auth.signInWithPassword({

      email,
      password

    });


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;

  }


  currentUser =
    data.user;


  await loadUser();


  showMessage(
    "✅ Connexion réussie.",
    "success"
  );

}


/* =====================================
   CHARGER UTILISATEUR
===================================== */

async function loadUser() {

  const {
    data
  } =
    await sb.auth.getUser();


  currentUser =
    data?.user || null;


  const authCard =
    document.getElementById(
      "authCard"
    );

  const investorSpace =
    document.getElementById(
      "investorSpace"
    );


  if (!currentUser) {

    authCard.classList.remove(
      "hidden"
    );

    investorSpace.classList.add(
      "hidden"
    );

    return;

  }


  authCard.classList.add(
    "hidden"
  );

  investorSpace.classList.remove(
    "hidden"
  );


  document.getElementById(
    "userEmail"
  ).textContent =
    "Connecté : " +
    currentUser.email;


  await loadProjects();

  await loadInterestCount();

  await loadMyInterests();

}


/* =====================================
   DÉCONNEXION
===================================== */

async function logout() {

  await sb.auth.signOut();


  currentUser =
    null;

  projects =
    [];


  document.getElementById(
    "investorSpace"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "authCard"
  ).classList.remove(
    "hidden"
  );


  showMessage(
    "Vous êtes déconnecté.",
    "success"
  );

}


/* =====================================
   RECHERCHE
===================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function () {

      const value =
        this.value
          .toLowerCase()
          .trim();


      const filtered =
        projects.filter(
          project =>

            (project.title || "")
              .toLowerCase()
              .includes(value)

            ||

            (project.sector || "")
              .toLowerCase()
              .includes(value)

            ||

            (project.description || "")
              .toLowerCase()
              .includes(value)

        );


      displayProjects(
        filtered
      );

    }
  );


/* =====================================
   BOUTONS
===================================== */

document
  .getElementById(
    "loginBtn"
  )
  .addEventListener(
    "click",
    login
  );


document
  .getElementById(
    "signupBtn"
  )
  .addEventListener(
    "click",
    signup
  );


document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",
    logout
  );


/* =====================================
   SESSION SUPABASE
===================================== */

sb.auth.onAuthStateChange(
  async (event, session) => {

    currentUser =
      session?.user || null;

    if (event === "SIGNED_IN") {
      await loadUser();
    }

    if (event === "SIGNED_OUT") {
      await loadUser();
    }

  }
);


/* =====================================
   DÉMARRAGE
===================================== */

loadUser();

</script>

</body>
  </html>
