<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇬🇳 Guinée Invest Hub</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5f3;
    }

    .box {
      max-width: 450px;
      margin: 50px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      color: #16803c;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: 0;
      background: #16803c;
      color: white;
      font-weight: bold;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🇬🇳 Guinée Invest Hub</h1>

  <input id="email" type="email" placeholder="Votre email">

  <input id="password" type="password" placeholder="Votre mot de passe">

  <button id="signup">
    Créer mon compte
  </button>

  <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(function () {

  const url = "https://phwnkvglvebbajixwjau.supabase.co";

  const key = sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK

  const sb = window.supabase.createClient(url, key);

  const button = document.getElementById("signup");
  const message = document.getElementById("message");

  button.addEventListener("click", async function () {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      message.textContent = "❌ Remplis les deux champs.";
      return;
    }

    message.textContent = "⏳ Création du compte...";

    const result = await sb.auth.signUp({
      email: email,
      password: password
    });

    if (result.error) {
      message.textContent = "❌ " + result.error.message;
      return;
    }

    message.textContent = "✅ COMPTE CRÉÉ !";

  });

})();
</script>

</body>
</html>
