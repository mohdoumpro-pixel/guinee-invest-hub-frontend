<p id="message"></p>

<script>

const SUPABASE_URL =

const SUPABASE_KEY =

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

document.getElementById("testBtn").onclick = async function() {

  document.getElementById("message").textContent =

};
