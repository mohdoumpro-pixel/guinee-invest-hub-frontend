<head>

  <style>

    h1 {

      color: #087f3e;
    }

    input {

<body>

<div class="container">

  <h2>Créer un compte</h2>

  <input id="email" type="email" placeholder="Votre adresse e-mail">

  <input id="password" type="password" placeholder="Votre mot de passe">

  <button type="button" onclick="creerCompte()">
    Créer un compte
  </button>

  <button type="button" onclick="connexion()">
    Se connecter
  </button>

  <div id="userBox">
    <h2>Bienvenue 👋</h2>
    <p id="userEmail"></p>

    <button type="button" onclick="deconnexion()">
      Se déconnecter
    </button>
  </div>

  <p id="message"></p>

</div>

<script>

window.clientSupabase = window.supabase.createClient(

  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;
  var message = document.getElementById("message");

  if (!email || !password) {
    message.textContent = "⚠️ Remplis tous les champs.";
    return;
  }

  if (password.length < 6) {
    message.textContent = "⚠️ Minimum 6 caractères pour le mot de passe.";
    return;
  }

  message.textContent = "⏳ Création du compte...";
setTimeout(function() {
  message.textContent = "✅ LE CODE CONTINUE À S'EXÉCUTER";
}, 3000);
  window.clientSupabase.auth.signUp({
  email: email,
  password: password
})
.then(function(result) {

})
.catch(function(error) {

      message.textContent = "❌ " + result.error.message;
      return;
    }
console.log("SUPABASE : réponse reçue", result);
    message.textContent = "✅ COMPTE CRÉÉ AVEC SUCCÈS !";

  }).catch(function(error) {

    message.textContent = "❌ " + error.message;

  });

function connexion() {

  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;
  var message = document.getElementById("message");

  if (!email || !password) {
    message.textContent = "⚠️ Remplis tous les champs.";
    return;
  }

  message.textContent = "⏳ Connexion...";

  window.clientSupabase.auth.signInWithPassword({
    email: email,
    password: password
  }).then(function(result) {

    if (result.error) {
      message.textContent = "❌ " + result.error.message;
      return;
    }

    document.getElementById("userBox").style.display = "block";
    document.getElementById("userEmail").textContent =
      "Connecté avec : " + result.data.user.email;

    message.textContent = "✅ Connexion réussie !";

  }).catch(function(error) {

    message.textContent = "❌ " + error.message;

  });
}


function deconnexion() {

  window.clientSupabase.auth.signOut().then(function() {

    document.getElementById("userBox").style.display = "none";

    document.getElementById("message").textContent =
      "✅ Déconnecté.";

  });

}

</script>

</body>
</html>
