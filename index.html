<!DOCTYPE html>
<html>
<body>

<h2>Test connexion Supabase</h2>

<button id="test">Tester Supabase</button>

<p id="result"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://phwnkvglvebbajixwjau.supabase.co";

const SUPABASE_KEY =
sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("test").onclick =
async function () {

  document.getElementById("result").textContent =
  "⏳ Test...";

  const result =
    await client.auth.getSession();

  if (result.error) {
    document.getElementById("result").textContent =
    "❌ " + result.error.message;
  } else {
    document.getElementById("result").textContent =
    "✅ CONNEXION SUPABASE OK";
  }
};
</script>

</body>
</html>
