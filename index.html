<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #087f3e;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: #087f3e;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    #userBox {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🇬🇳 Guinée Invest Hub</h1>

  <h2>Créer un compte</h2>

  <div id="authBox">

    <input
      id="email"
      type="email"
      placeholder="Votre adresse e-mail"
    >

    <input
      id="password"
      type="password"
      placeholder="Votre mot de passe"
    >

    <button id="signupBtn" type="button">
      Créer un compte
    </button>

    <button id="loginBtn" type="button">
      Se connecter
    </button>

  </div>

  <div id="userBox">

    <h2>Bienvenue 👋</h2>

    <p id="userEmail"></p>

    <button id="logoutBtn" type="button">
      Se déconnecter
    </button>

  </div>

  <p id="message"></p>

</div>

<script>

document.addEventListener("DOMContentLoaded", function() {

  const SUPABASE_URL =
    "https://phwnkvglvebbajixwjau.supabase.co";

  const SUPABASE_KEY =
    sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK

  const client =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const signupBtn =
    document.getElementById("signupBtn");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const message =
    document.getElementById("message");

  const authBox =
    document.getElementById("authBox");

  const userBox =
    document.getElementById("userBox");

  const userEmail =
    document.getElementById("userEmail");


  function msg(text) {
    message.textContent = text;
  }


  signupBtn.onclick = async function() {

    const e = email.value.trim();
    const p = password.value;

    if (!e || !p) {
      msg("⚠️ Remplis tous les champs.");
      return;
    }

    if (p.length < 6) {
      msg("⚠️ Le mot de passe doit avoir au moins 6 caractères.");
      return;
    }

    msg("⏳ Création du compte...");

    try {

      const result = await client.auth.signUp({
        email: e,
        password: p
      });

      if (result.error) {
        msg("❌ " + result.error.message);
        return;
      }

      msg("✅ Compte créé avec succès !");

      email.value = "";
      password.value = "";

    } catch (err) {

      msg("❌ Erreur : " + err.message);

    }

  };


  loginBtn.onclick = async function() {

    const e = email.value.trim();
    const p = password.value;

    if (!e || !p) {
      msg("⚠️ Remplis tous les champs.");
      return;
    }

    msg("⏳ Connexion...");

    try {

      const result =
        await client.auth.signInWithPassword({
          email: e,
          password: p
        });

      if (result.error) {
        msg("❌ " + result.error.message);
        return;
      }

      msg("✅ Connexion réussie !");

      authBox.style.display = "none";
      userBox.style.display = "block";

      userEmail.textContent =
        "Connecté avec : " + result.data.user.email;

    } catch (err) {

      msg("❌ Erreur : " + err.message);

    }

  };


  logoutBtn.onclick = async function() {

    await client.auth.signOut();

    authBox.style.display = "block";
    userBox.style.display = "none";

    msg("✅ Vous êtes déconnecté.");

  };


});

</script>

</body>
</html>
