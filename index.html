<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🇬🇳 Guinée Invest Hub</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 45px;
      margin-bottom: 5px;
    }

    h1 {
      text-align: center;
      color: #087f5b;
      margin: 5px 0 10px;
    }

    h2 {
      text-align: center;
      margin-top: 25px;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087f5b;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #login {
      background: #1864ab;
    }

    #logout {
      background: #c92a2a;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      min-height: 24px;
    }

    #dashboard {
      display: none;
    }

    .welcome {
      background: #e6fcf5;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-top: 20px;
    }

    .welcome h2 {
      color: #087f5b;
      margin-top: 0;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- ========================= -->
    <!-- CONNEXION / INSCRIPTION -->
    <!-- ========================= -->

    <div id="auth" class="card">

      <div class="logo">🇬🇳</div>

      <h1>Guinée Invest Hub</h1>

      <p class="description">
        La plateforme qui connecte les investisseurs
        aux projets guinéens.
      </p>

      <h2>Créer un compte</h2>

      <input
        id="email"
        type="email"
        placeholder="Votre adresse e-mail"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Votre mot de passe"
        autocomplete="new-password"
      >

      <button id="signup" type="button">
        Créer mon compte
      </button>

      <button id="login" type="button">
        Se connecter
      </button>

      <p id="message"></p>

      <div class="footer">
        Guinée Invest Hub 🇬🇳
      </div>

    </div>


    <!-- ========================= -->
    <!-- TABLEAU DE BORD -->
    <!-- ========================= -->

    <div id="dashboard" class="card">

      <div class="logo">🇬🇳</div>

      <h1>Guinée Invest Hub</h1>

      <div class="welcome">

        <h2>✅ Bienvenue !</h2>

        <p id="userEmail"></p>

        <p>
          Votre compte est connecté.
        </p>

      </div>

      <button id="logout" type="button">
        Se déconnecter
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================= -->

  <script>

    const SUPABASE_URL =
      "https://phwnkvglvebbajixwjau.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK";

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // Éléments HTML

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    const auth =
      document.getElementById("auth");

    const dashboard =
      document.getElementById("dashboard");

    const userEmail =
      document.getElementById("userEmail");

    const signup =
      document.getElementById("signup");

    const login =
      document.getElementById("login");

    const logout =
      document.getElementById("logout");


    // =========================
    // CRÉER UN COMPTE
    // =========================

    signup.onclick = async function () {

      message.textContent =
        "⏳ Création du compte...";

      const e =
        email.value.trim();

      const p =
        password.value;


      if (!e || !p) {

        message.textContent =
          "❌ Remplis les deux champs.";

        return;
      }


      if (p.length < 6) {

        message.textContent =
          "❌ Le mot de passe doit contenir au moins 6 caractères.";

        return;
      }


      try {

        const result =
          await client.auth.signUp({
            email: e,
            password: p
          });


        if (result.error) {

          message.textContent =
            "❌ " + result.error.message;

          return;
        }


        message.textContent =
          "✅ Compte créé avec succès !";

        email.value = "";
        password.value = "";

      }

      catch (error) {

        message.textContent =
          "❌ " + error.message;

      }

    };


    // =========================
    // SE CONNECTER
    // =========================

    login.onclick = async function () {

      message.textContent =
        "⏳ Connexion...";


      const e =
        email.value.trim();

      const p =
        password.value;


      if (!e || !p) {

        message.textContent =
          "❌ Remplis les deux champs.";

        return;
      }


      try {

        const result =
          await client.auth.signInWithPassword({
            email: e,
            password: p
          });


        if (result.error) {

          message.textContent =
            "❌ " + result.error.message;

          return;
        }


        afficherDashboard(
          result.data.user
        );

      }

      catch (error) {

        message.textContent =
          "❌ " + error.message;

      }

    };


    // =========================
    // SE DÉCONNECTER
    // =========================

    logout.onclick = async function () {

      await client.auth.signOut();

      dashboard.style.display =
        "none";

      auth.style.display =
        "block";

      email.value = "";
      password.value = "";
      message.textContent = "";

    };


    // =========================
    // AFFICHER DASHBOARD
    // =========================

    function afficherDashboard(user) {

      auth.style.display =
        "none";

      dashboard.style.display =
        "block";

      userEmail.textContent =
        "Connecté : " + user.email;

    }


    // =========================
    // VÉRIFIER LA SESSION
    // =========================

    async function verifierConnexion() {

      try {

        const result =
          await client.auth.getSession();


        if (result.data.session) {

          afficherDashboard(
            result.data.session.user
          );

        }

      }

      catch (error) {

        console.log(
          "Erreur session :",
          error.message
        );

      }

    }


    // Vérification au démarrage

    verifierConnexion();

  </script>

</body>
</html>
