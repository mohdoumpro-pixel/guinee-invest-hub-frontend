<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇬🇳 Guinée Invest Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial;background:#f4f7f5;margin:0;padding:20px}
.box{max-width:500px;margin:30px auto;background:white;padding:25px;border-radius:15px}
h1,h2{text-align:center}
input,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#16803c;color:white;border:0;font-weight:bold;cursor:pointer}
.dark{background:#333}
.hidden{display:none}
#message{text-align:center;font-weight:bold;margin:15px}
.project{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:10px}
</style>
</head>

<body>

<div class="box">

<h1>🇬🇳 Guinée Invest Hub</h1>

<div id="message"></div>

<div id="signupBox">
<h2>Créer un compte</h2>

<input id="signupEmail" type="email" placeholder="Votre email">
<input id="signupPassword" type="password" placeholder="Mot de passe">

<button onclick="signup()">Créer mon compte</button>
<button class="dark" onclick="showLogin()">J'ai déjà un compte</button>
</div>

<div id="loginBox" class="hidden">
<h2>Connexion</h2>

<input id="loginEmail" type="email" placeholder="Votre email">
<input id="loginPassword" type="password" placeholder="Mot de passe">

<button onclick="login()">Se connecter</button>
<button class="dark" onclick="showSignup()">Créer un compte</button>
</div>

<div id="roleBox" class="hidden">
<h2>Choisissez votre profil</h2>

<button onclick="saveRole('investisseur')">💰 Investisseur</button>
<button onclick="saveRole('porteur de projet')">🚀 Porteur de projet</button>
</div>

<div id="dashboard" class="hidden">
<h2>Bienvenue 🇬🇳</h2>

<button onclick="showProjects()">📊 Voir les projets</button>
<button onclick="showAddProject()">➕ Ajouter un projet</button>
<button class="dark" onclick="logout()">Déconnexion</button>
</div>

<div id="projectsBox" class="hidden">
<h2>Projets</h2>
<div id="projectsList">Chargement...</div>
<button class="dark" onclick="backDashboard()">Retour</button>
</div>

<div id="addProjectBox" class="hidden">
<h2>Ajouter un projet</h2>

<input id="projectTitle" placeholder="Titre du projet">

<textarea id="projectDescription" placeholder="Description"></textarea>

<input id="projectSector" placeholder="Secteur">

<button onclick="addProject()">Publier le projet</button>
<button class="dark" onclick="backDashboard()">Retour</button>
</div>

</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://phwnkvglvebbajixwjau.supabase.co";

const SUPABASE_KEY =
sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   AFFICHAGE
========================= */

function message(text){
document.getElementById("message").textContent=text;
}

function hideAll(){
document.getElementById("signupBox").classList.add("hidden");
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("roleBox").classList.add("hidden");
document.getElementById("dashboard").classList.add("hidden");
document.getElementById("projectsBox").classList.add("hidden");
document.getElementById("addProjectBox").classList.add("hidden");
}

function showSignup(){
hideAll();
document.getElementById("signupBox").classList.remove("hidden");
}

function showLogin(){
hideAll();
document.getElementById("loginBox").classList.remove("hidden");
}


/* =========================
   INSCRIPTION
========================= */

async function signup(){

const email =
document.getElementById("signupEmail").value.trim();

const password =
document.getElementById("signupPassword").value;

if(!email || !password){
message("❌ Remplis tous les champs.");
return;
}

if(password.length < 6){
message("❌ Minimum 6 caractères.");
return;
}

message("⏳ Création du compte...");

try{

const result =
await client.auth.signUp({
email:email,
password:password
});

if(result.error){
message("❌ "+result.error.message);
return;
}

message("✅ Compte créé !");

hideAll();

document
.getElementById("roleBox")
.classList.remove("hidden");

}catch(error){

message("❌ "+error.message);

}

}


/* =========================
   CONNEXION
========================= */

async function login(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

if(!email || !password){
message("❌ Remplis tous les champs.");
return;
}

message("⏳ Connexion...");

try{

const result =
await client.auth.signInWithPassword({
email:email,
password:password
});

if(result.error){
message("❌ "+result.error.message);
return;
}

message("✅ Connexion réussie !");

await checkProfile();

}catch(error){

message("❌ "+error.message);

}

}


/* =========================
   PROFIL
========================= */

async function saveRole(role){

const result =
await client.auth.getUser();

if(result.error || !result.data.user){
message("❌ Utilisateur non connecté.");
return;
}

message("⏳ Enregistrement...");

const user =
result.data.user;

const profile =
await client
.from("profiles")
.upsert({
id:user.id,
role:role
});

if(profile.error){
message("❌ "+profile.error.message);
return;
}

message("✅ Profil enregistré !");

hideAll();

document
.getElementById("dashboard")
.classList.remove("hidden");

}


/* =========================
   VÉRIFICATION PROFIL
========================= */

async function checkProfile(){

const result =
await client.auth.getUser();

if(result.error || !result.data.user){
showLogin();
return;
}

const user =
result.data.user;

const profile =
await client
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();

if(profile.error){
message("❌ "+profile.error.message);
return;
}

hideAll();

if(profile.data){

document
.getElementById("dashboard")
.classList.remove("hidden");

}else{

document
.getElementById("roleBox")
.classList.remove("hidden");

}

}


/* =========================
   PROJETS
========================= */

async function showProjects(){

hideAll();

document
.getElementById("projectsBox")
.classList.remove("hidden");

const list =
document.getElementById("projectsList");

list.innerHTML="⏳ Chargement...";

const result =
await client
.from("projects")
.select("*");

if(result.error){

list.innerHTML=
"❌ "+result.error.message;

return;

}

if(!result.data || result.data.length===0){

list.innerHTML=
"Aucun projet pour le moment.";

return;

}

list.innerHTML="";

result.data.forEach(project=>{

list.innerHTML+=`
<div class="project">
<h3>${project.title || ""}</h3>
<p>${project.description || ""}</p>
<strong>${project.sector || ""}</strong>
</div>
`;

});

}


/* =========================
   AJOUT PROJET
========================= */

async function addProject(){

const title =
document.getElementById("projectTitle").value.trim();

const description =
document.getElementById("projectDescription").value.trim();

const sector =
document.getElementById("projectSector").value.trim();

if(!title){
message("❌ Ajoute un titre.");
return;
}

message("⏳ Publication...");

const user =
await client.auth.getUser();

if(user.error || !user.data.user){

message("❌ Connecte-toi d'abord.");
return;

}

const result =
await client
.from("projects")
.insert({
id:crypto.randomUUID(),
title:title,
description:description,
sector:sector
});

if(result.error){

message("❌ "+result.error.message);
return;

}

message("✅ Projet publié !");

document.getElementById("projectTitle").value="";
document.getElementById("projectDescription").value="";
document.getElementById("projectSector").value="";

showProjects();

}


/* =========================
   NAVIGATION
========================= */

function showAddProject(){

hideAll();

document
.getElementById("addProjectBox")
.classList.remove("hidden");

}

function backDashboard(){

hideAll();

document
.getElementById("dashboard")
.classList.remove("hidden");

}

async function logout(){

await client.auth.signOut();

message("✅ Déconnecté.");

showLogin();

}


/* =========================
   DÉMARRAGE
========================= */

async function startApp(){

const result =
await client.auth.getSession();

if(result.data.session){

await checkProfile();

}else{

showSignup();

}

}

startApp();

</script>

</body>
</html>
