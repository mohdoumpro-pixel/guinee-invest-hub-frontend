<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🇬🇳 Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
    }

    .app {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      color: #08783f;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 0;
      border-radius: 8px;
      background: #08783f;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .blue {
      background: #1565c0;
    }

    .red {
      background: #c62828;
    }

    .gray {
      background: #555;
    }

    .hidden {
      display: none;
    }

    #message {
      text-align: center;
      font-weight: bold;
    }

    .project {
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .sector {
      color: #08783f;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🇬🇳 Guinée Invest Hub</h1>

  <p id="message"></p>


  <!-- CONNEXION -->

  <div id="login" class="card">

    <h2>Créer un compte / Connexion</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Mot de passe"
    >

    <button onclick="signup()">
      Créer mon compte
    </button>

    <button class="blue" onclick="login()">
      Se connecter
    </button>

  </div>


  <!-- PROFIL -->

  <div id="role" class="card hidden">

    <h2>Choisissez votre profil</h2>

    <button onclick="saveRole('investisseur')">
      💰 Investisseur
    </button>

    <button class="blue"
      onclick="saveRole('porteur_de_projet')">
      🏗️ Porteur de projet
    </button>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard" class="card hidden">

    <h2>📊 Tableau de bord</h2>

    <p id="welcome"></p>

    <button onclick="showProjects()">
      📊 Voir les projets
    </button>

    <button class="blue" onclick="showAdd()">
      ➕ Ajouter un projet
    </button>

    <button class="red" onclick="logout()">
      🚪 Déconnexion
    </button>

  </div>


  <!-- PROJETS -->

  <div id="projects" class="card hidden">

    <h2>📊 Projets guinéens</h2>

    <div id="projectList">
      Chargement...
    </div>

    <button class="gray" onclick="back()">
      ← Retour
    </button>

  </div>


  <!-- AJOUT -->

  <div id="add" class="card hidden">

    <h2>➕ Ajouter un projet</h2>

    <input
      id="title"
      placeholder="Titre du projet"
    >

    <textarea
      id="description"
      placeholder="Description du projet">
    </textarea>

    <input
      id="sector"
      placeholder="Secteur"
    >

    <button onclick="addProject()">
      🚀 Publier
    </button>

    <button class="gray" onclick="back()">
      ← Retour
    </button>

  </div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://phwnkvglvebbajixwjau.supabase.co";


/*
   COLLE TA CLÉ ICI

   Exemple :

   const SUPABASE_KEY =
   "sb_publishable_xxxxxxxxx";
*/

const SUPABASE_KEY =
sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK


const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   OUTILS
===================================== */

function msg(text) {

  document.getElementById("message")
    .textContent = text;

}


function hideAll() {

  document.getElementById("login")
    .classList.add("hidden");

  document.getElementById("role")
    .classList.add("hidden");

  document.getElementById("dashboard")
    .classList.add("hidden");

  document.getElementById("projects")
    .classList.add("hidden");

  document.getElementById("add")
    .classList.add("hidden");

}


/* =====================================
   CREER COMPTE
===================================== */

async function signup() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {

    msg("❌ Remplis tous les champs.");

    return;
  }

  msg("⏳ Création du compte...");

  const result =
    await supabase.auth.signUp({
      email: email,
      password: password
    });

  if (result.error) {

    msg("❌ " + result.error.message);

    return;
  }

  msg("✅ Compte créé !");

  hideAll();

  document.getElementById("role")
    .classList.remove("hidden");

}


/* =====================================
   CONNEXION
===================================== */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  msg("⏳ Connexion...");

  const result =
    await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (result.error) {

    msg("❌ " + result.error.message);

    return;
  }

  await loadUser();

}


/* =====================================
   UTILISATEUR
===================================== */

async function loadUser() {

  const result =
    await supabase.auth.getUser();

  if (!result.data.user) {

    return;
  }

  const user =
    result.data.user;


  const profile =
    await supabase
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .maybeSingle();


  if (!profile.data) {

    hideAll();

    document.getElementById("role")
      .classList.remove("hidden");

    return;
  }


  showDashboard(profile.data.role);

}


/* =====================================
   ROLE
===================================== */

async function saveRole(role) {

  const result =
    await supabase.auth.getUser();

  if (!result.data.user) {

    msg("❌ Connecte-toi.");

    return;
  }

  const user =
    result.data.user;


  const save =
    await supabase
      .from("profiles")
      .upsert({
        id: user.id,
        role: role
      });


  if (save.error) {

    msg("❌ " + save.error.message);

    return;
  }


  msg("✅ Profil enregistré.");

  showDashboard(role);

}


/* =====================================
   DASHBOARD
===================================== */

function showDashboard(role) {

  hideAll();

  document.getElementById("dashboard")
    .classList.remove("hidden");

  document.getElementById("welcome")
    .textContent =
    "Bienvenue 👋 Profil : " + role;

}


/* =====================================
   PROJETS
===================================== */

async function showProjects() {

  hideAll();

  document.getElementById("projects")
    .classList.remove("hidden");

  const list =
    document.getElementById("projectList");

  list.innerHTML =
    "⏳ Chargement...";


  const result =
    await supabase
      .from("projects")
      .select("*");


  if (result.error) {

    list.innerHTML =
      "❌ " + result.error.message;

    return;
  }


  if (!result.data.length) {

    list.innerHTML =
      "<p>Aucun projet pour le moment.</p>";

    return;
  }


  list.innerHTML = "";


  result.data.forEach(function(project) {

    const div =
      document.createElement("div");

    div.className = "project";


    const h3 =
      document.createElement("h3");

    h3.textContent =
      project.title || "Projet sans nom";


    const sector =
      document.createElement("p");

    sector.className = "sector";

    sector.textContent =
      project.sector || "Secteur non précisé";


    const description =
      document.createElement("p");

    description.textContent =
      project.description || "";


    div.appendChild(h3);
    div.appendChild(sector);
    div.appendChild(description);

    list.appendChild(div);

  });

}


/* =====================================
   AJOUT PROJET
===================================== */

function showAdd() {

  hideAll();

  document.getElementById("add")
    .classList.remove("hidden");

}


async function addProject() {

  const title =
    document.getElementById("title")
      .value.trim();

  const description =
    document.getElementById("description")
      .value.trim();

  const sector =
    document.getElementById("sector")
      .value.trim();


  if (!title) {

    msg("❌ Ajoute un titre.");

    return;
  }


  msg("⏳ Publication...");


  const result =
    await supabase
      .from("projects")
      .insert({
        id: crypto.randomUUID(),
        title: title,
        description: description,
        sector: sector
      });


  if (result.error) {

    msg("❌ " + result.error.message);

    return;
  }


  msg("✅ Projet publié !");

  await showProjects();

}


/* =====================================
   RETOUR
===================================== */

function back() {

  showDashboard("utilisateur");

}


/* =====================================
   DECONNEXION
===================================== */

async function logout() {

  await supabase.auth.signOut();

  hideAll();

  document.getElementById("login")
    .classList.remove("hidden");

  msg("✅ Déconnecté.");

}


/* =====================================
   SESSION
===================================== */

(async function() {

  const result =
    await supabase.auth.getSession();

  if (
    result.data &&
    result.data.session
  ) {

    await loadUser();

  }

})();

</script>

</body>
</html>
