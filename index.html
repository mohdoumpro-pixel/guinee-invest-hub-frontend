<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇬🇳 Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #0b6b3a;
    }

    .card {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 0;
      border-radius: 8px;
      background: #0b6b3a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .danger {
      background: #c62828;
    }

    .project {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    .sector {
      display: inline-block;
      background: #e8f5e9;
      color: #0b6b3a;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    #message {
      text-align: center;
      font-weight: bold;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🇬🇳 Guinée Invest Hub</h1>

  <div id="message"></div>

  <!-- AUTH -->
  <div id="authSection" class="card">

    <h2>Créer un compte</h2>

    <input
      id="email"
      type="email"
      placeholder="Votre email"
    >

    <input
      id="password"
      type="password"
      placeholder="Votre mot de passe"
    >

    <button id="signupBtn">
      Créer mon compte
    </button>

    <button id="loginBtn">
      Se connecter
    </button>

  </div>

  <!-- ROLE -->
  <div id="roleSection" class="card hidden">

    <h2>Bienvenue 👋</h2>

    <p>Choisissez votre profil :</p>

    <button id="investorBtn">
      💰 Investisseur
    </button>

    <button id="ownerBtn">
      🏗️ Porteur de projet
    </button>

  </div>

  <!-- DASHBOARD -->
  <div id="dashboardSection" class="card hidden">

    <h2>Tableau de bord</h2>

    <p id="welcomeText"></p>

    <button id="projectsBtn">
      📊 Voir les projets
    </button>

    <button id="addProjectBtn">
      ➕ Ajouter un projet
    </button>

    <button id="logoutBtn" class="danger">
      🚪 Déconnexion
    </button>

  </div>

  <!-- PROJECTS -->
  <div id="projectsSection" class="card hidden">

    <h2>📊 Projets disponibles</h2>

    <div id="projectsList">
      Chargement...
    </div>

    <button id="backBtn">
      ← Retour
    </button>

  </div>

  <!-- ADD PROJECT -->
  <div id="addProjectSection" class="card hidden">

    <h2>➕ Ajouter un projet</h2>

    <input
      id="projectTitle"
      type="text"
      placeholder="Titre du projet"
    >

    <textarea
      id="projectDescription"
      placeholder="Description du projet"
      rows="5"
    ></textarea>

    <input
      id="projectSector"
      type="text"
      placeholder="Secteur (agriculture, immobilier...)"
    >

    <button id="saveProjectBtn">
      Publier le projet
    </button>

    <button id="backAddBtn">
      ← Retour
    </button>

  </div>

</div>

<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://phwnkvglvebbajixwjau.supabase.co";

  const SUPABASE_KEY =
    sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK

  const client =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     ELEMENTS
  ========================= */

  const message =
    document.getElementById("message");

  const authSection =
    document.getElementById("authSection");

  const roleSection =
    document.getElementById("roleSection");

  const dashboardSection =
    document.getElementById("dashboardSection");

  const projectsSection =
    document.getElementById("projectsSection");

  const addProjectSection =
    document.getElementById("addProjectSection");


  /* =========================
     MESSAGE
  ========================= */

  function showMessage(text) {
    message.textContent = text;
  }


  /* =========================
     AUTH
  ========================= */

  document
    .getElementById("signupBtn")
    .addEventListener("click", async function() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {
        showMessage("❌ Remplis tous les champs.");
        return;
      }

      showMessage("⏳ Création du compte...");

      const { data, error } =
        await client.auth.signUp({
          email: email,
          password: password
        });

      if (error) {
        showMessage("❌ " + error.message);
        return;
      }

      if (data.user) {
        showMessage("✅ Compte créé avec succès !");
        authSection.classList.add("hidden");
        roleSection.classList.remove("hidden");
      }

    });


  document
    .getElementById("loginBtn")
    .addEventListener("click", async function() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {
        showMessage("❌ Remplis tous les champs.");
        return;
      }

      showMessage("⏳ Connexion...");

      const { data, error } =
        await client.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        showMessage("❌ " + error.message);
        return;
      }

      showMessage("✅ Connexion réussie.");

      await loadUser();

    });


  /* =========================
     LOAD USER
  ========================= */

  async function loadUser() {

    const {
      data: { user }
    } = await client.auth.getUser();

    if (!user) {
      return;
    }

    authSection.classList.add("hidden");

    const { data: profile } =
      await client
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();

    if (!profile) {

      roleSection.classList.remove("hidden");

      dashboardSection.classList.add("hidden");

      return;
    }

    roleSection.classList.add("hidden");

    dashboardSection.classList.remove("hidden");

    document.getElementById("welcomeText").textContent =
      "Bienvenue 👋 Votre profil : " +
      profile.role;

  }


  /* =========================
     SAVE ROLE
  ========================= */

  async function saveRole(role) {

    const {
      data: { user }
    } = await client.auth.getUser();

    if (!user) {
      showMessage("❌ Utilisateur non connecté.");
      return;
    }

    showMessage("⏳ Enregistrement...");

    const { error } =
      await client
        .from("profiles")
        .upsert({
          id: user.id,
          role: role
        });

    if (error) {
      showMessage("❌ " + error.message);
      return;
    }

    showMessage("✅ Bienvenue !");

    roleSection.classList.add("hidden");

    dashboardSection.classList.remove("hidden");

    document.getElementById("welcomeText").textContent =
      "Bienvenue 👋 Votre profil : " + role;

  }


  document
    .getElementById("investorBtn")
    .addEventListener("click", function() {
      saveRole("investisseur");
    });


  document
    .getElementById("ownerBtn")
    .addEventListener("click", function() {
      saveRole("porteur_de_projet");
    });


  /* =========================
     SHOW PROJECTS
  ========================= */

  document
    .getElementById("projectsBtn")
    .addEventListener("click", async function() {

      dashboardSection.classList.add("hidden");

      projectsSection.classList.remove("hidden");

      await chargerProjets();

    });


  /* =========================
     LOAD PROJECTS
  ========================= */

  async function chargerProjets() {

    const list =
      document.getElementById("projectsList");

    list.innerHTML =
      "⏳ Chargement des projets...";

    const { data, error } =
      await client
        .from("projects")
        .select("*");

    if (error) {

      list.innerHTML =
        "❌ " + error.message;

      return;
    }

    if (!data || data.length === 0) {

      list.innerHTML =
        "<p>Aucun projet pour le moment.</p>";

      return;
    }

    list.innerHTML = "";

    data.forEach(function(project) {

      const div =
        document.createElement("div");

      div.className = "project";

      div.innerHTML = `
        <h3>
          ${project.title || "Projet sans nom"}
        </h3>

        <span class="sector">
          ${project.sector || "Secteur non précisé"}
        </span>

        <p>
          ${project.description || "Aucune description."}
        </p>
      `;

      list.appendChild(div);

    });

  }


  /* =========================
     ADD PROJECT
  ========================= */

  document
    .getElementById("addProjectBtn")
    .addEventListener("click", function() {

      dashboardSection.classList.add("hidden");

      addProjectSection.classList.remove("hidden");

    });


  document
    .getElementById("saveProjectBtn")
    .addEventListener("click", async function() {

      const title =
        document
          .getElementById("projectTitle")
          .value
          .trim();

      const description =
        document
          .getElementById("projectDescription")
          .value
          .trim();

      const sector =
        document
          .getElementById("projectSector")
          .value
          .trim();

      if (!title) {
        showMessage("❌ Ajoute un titre.");
        return;
      }

      showMessage("⏳ Publication du projet...");

      const { error } =
        await client
          .from("projects")
          .insert({
            id: crypto.randomUUID(),
            title: title,
            description: description,
            sector: sector
          });

      if (error) {

        showMessage("❌ " + error.message);

        return;
      }

      showMessage("✅ Projet publié !");

      document
        .getElementById("projectTitle")
        .value = "";

      document
        .getElementById("projectDescription")
        .value = "";

      document
        .getElementById("projectSector")
        .value = "";

      addProjectSection.classList.add("hidden");

      projectsSection.classList.remove("hidden");

      await chargerProjets();

    });


  /* =========================
     BACK BUTTONS
  ========================= */

  document
    .getElementById("backBtn")
    .addEventListener("click", function() {

      projectsSection.classList.add("hidden");

      dashboardSection.classList.remove("hidden");

    });


  document
    .getElementById("backAddBtn")
    .addEventListener("click", function() {

      addProjectSection.classList.add("hidden");

      dashboardSection.classList.remove("hidden");

    });


  /* =========================
     LOGOUT
  ========================= */

  document
    .getElementById("logoutBtn")
    .addEventListener("click", async function() {

      await client.auth.signOut();

      authSection.classList.remove("hidden");

      roleSection.classList.add("hidden");

      dashboardSection.classList.add("hidden");

      projectsSection.classList.add("hidden");

      addProjectSection.classList.add("hidden");

      showMessage("✅ Déconnecté.");

    });


  /* =========================
     START
  ========================= */

  (async function() {

    try {

      const {
        data: { session }
      } = await client.auth.getSession();

      if (session) {
        await loadUser();
      }

    } catch (error) {

      showMessage("❌ " + error.message);

    }

  })();

</script>

</body>
</html>
