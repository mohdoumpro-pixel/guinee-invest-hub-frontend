<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🇬🇳 Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .container {
      max-width: 450px;
      margin: auto;
      padding: 30px 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      font-size: 45px;
    }

    h1 {
      text-align: center;
      color: #087f5b;
    }

    h2 {
      text-align: center;
    }

    .description {
      text-align: center;
      color: #666;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #login {
      background: #1864ab;
    }

    #logout {
      background: #c92a2a;
    }

    .role-button {
      background: #f1f3f5;
      color: #222;
      border: 2px solid #ddd;
    }

    .role-button:hover {
      border-color: #087f5b;
    }

    #message {
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
      min-height: 25px;
    }

    #dashboard,
    #roleChoice {
      display: none;
    }

    .welcome {
      background: #e6fcf5;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin: 20px 0;
    }

    .role {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- AUTHENTIFICATION -->

  <div id="auth" class="card">

    <div class="logo">🇬🇳</div>

    <h1>Guinée Invest Hub</h1>

    <p class="description">
      Connectons les investisseurs aux projets guinéens.
    </p>

    <h2>Créer un compte</h2>

    <input
      id="email"
      type="email"
      placeholder="Votre adresse e-mail"
    >

    <input
      id="password"
      type="password"
      placeholder="Votre mot de passe"
    >

    <button id="signup" type="button">
      Créer mon compte
    </button>

    <button id="login" type="button">
      Se connecter
    </button>

    <p id="message"></p>

  </div>


  <!-- CHOIX DU PROFIL -->

  <div id="roleChoice" class="card">

    <div class="logo">👤</div>

    <h1>Votre profil</h1>

    <p class="description">
      Choisissez votre type de compte.
    </p>

    <button
      id="investisseur"
      class="role-button"
      type="button">
      💰 Investisseur
    </button>

    <button
      id="porteur"
      class="role-button"
      type="button">
      🚀 Porteur de projet
    </button>

    <p id="roleMessage"></p>

  </div>


  <!-- TABLEAU DE BORD -->

  <div id="dashboard" class="card">

    <div class="logo">🇬🇳</div>

    <h1>Guinée Invest Hub</h1>

    <div class="welcome">

      <h2>✅ Bienvenue !</h2>

      <p id="userEmail"></p>

      <div class="role" id="userRole"></div>

    </div>

    <button id="logout" type="button">
      Se déconnecter
    </button>

  </div>

</div>


<script>

  // ==========================
  // SUPABASE
  // ==========================

  const SUPABASE_URL =
    "https://phwnkvglvebbajixwjau.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK";

  const client =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================
  // ELEMENTS
  // ==========================

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const message =
    document.getElementById("message");

  const auth =
    document.getElementById("auth");

  const roleChoice =
    document.getElementById("roleChoice");

  const dashboard =
    document.getElementById("dashboard");

  const userEmail =
    document.getElementById("userEmail");

  const userRole =
    document.getElementById("userRole");

  const roleMessage =
    document.getElementById("roleMessage");


  let currentUser = null;


  // ==========================
  // CREER UN COMPTE
  // ==========================

  document.getElementById("signup").onclick =
  async function () {

    message.textContent =
      "⏳ Création du compte...";

    const e = email.value.trim();
    const p = password.value;

    if (!e || !p) {

      message.textContent =
        "❌ Remplis les deux champs.";

      return;
    }

    if (p.length < 6) {

      message.textContent =
        "❌ Mot de passe : 6 caractères minimum.";

      return;
    }

    try {

      const result =
        await client.auth.signUp({
          email: e,
          password: p
        });

      if (result.error) {

        message.textContent =
          "❌ " + result.error.message;

        return;
      }

      if (result.data.user) {

        currentUser =
          result.data.user;

        message.textContent =
          "✅ Compte créé !";

        setTimeout(function () {

          afficherChoixRole();

        }, 500);

      }

    } catch (error) {

      message.textContent =
        "❌ " + error.message;

    }

  };


  // ==========================
  // CONNEXION
  // ==========================

  document.getElementById("login").onclick =
  async function () {

    message.textContent =
      "⏳ Connexion...";

    try {

      const result =
        await client.auth.signInWithPassword({
          email: email.value.trim(),
          password: password.value
        });

      if (result.error) {

        message.textContent =
          "❌ " + result.error.message;

        return;
      }

      currentUser =
        result.data.user;

      await chargerProfil(currentUser);

    } catch (error) {

      message.textContent =
        "❌ " + error.message;

    }

  };


  // ==========================
  // AFFICHER CHOIX ROLE
  // ==========================

  function afficherChoixRole() {

    auth.style.display =
      "none";

    dashboard.style.display =
      "none";

    roleChoice.style.display =
      "block";

  }


  // ==========================
  // CHOISIR INVESTISSEUR
  // ==========================

  document.getElementById("investisseur").onclick =
  async function () {

    await enregistrerRole(
      "investisseur"
    );

  };


  // ==========================
  // CHOISIR PORTEUR
  // ==========================

  document.getElementById("porteur").onclick =
  async function () {

    await enregistrerRole(
      "porteur_projet"
    );

  };


  // ==========================
  // ENREGISTRER LE ROLE
  // ==========================

  async function enregistrerRole(role) {

    roleMessage.textContent =
      "⏳ Enregistrement...";

    if (!currentUser) {

      roleMessage.textContent =
        "❌ Utilisateur introuvable.";

      return;
    }

    try {

      const result =
        await client
          .from("profiles")
          .upsert({
            id: currentUser.id,
            role: role
          });

      if (result.error) {

        roleMessage.textContent =
          "❌ " + result.error.message;

        return;
      }

      afficherDashboardAvecRole(
        currentUser,
        role
      );

    } catch (error) {

      roleMessage.textContent =
        "❌ " + error.message;

    }

  }


  // ==========================
  // CHARGER LE PROFIL
  // ==========================

  async function chargerProfil(user) {

    try {

      const result =
        await client
          .from("profiles")
          .select("role")
          .eq("id", user.id)
          .maybeSingle();

      if (
        result.data &&
        result.data.role
      ) {

        afficherDashboardAvecRole(
          user,
          result.data.role
        );

      } else {

        afficherChoixRole();

      }

    } catch (error) {

      afficherChoixRole();

    }

  }


  // ==========================
  // DASHBOARD
  // ==========================

  function afficherDashboardAvecRole(
    user,
    role
  ) {

    auth.style.display =
      "none";

    roleChoice.style.display =
      "none";

    dashboard.style.display =
      "block";

    userEmail.textContent =
      "Connecté : " + user.email;

    if (role === "investisseur") {

      userRole.textContent =
        "💰 Investisseur";

    } else {

      userRole.textContent =
        "🚀 Porteur de projet";

    }

  }


  // ==========================
  // DECONNEXION
  // ==========================

  document.getElementById("logout").onclick =
  async function () {

    await client.auth.signOut();

    currentUser = null;

    dashboard.style.display =
      "none";

    roleChoice.style.display =
      "none";

    auth.style.display =
      "block";

    email.value = "";
    password.value = "";

  };


  // ==========================
  // VERIFIER SESSION
  // ==========================

  async function verifierConnexion() {

    try {

      const result =
        await client.auth.getSession();

      if (result.data.session) {

        currentUser =
          result.data.session.user;

        await chargerProfil(
          currentUser
        );

      }

    } catch (error) {

      console.log(error);

    }

  }


  verifierConnexion();

</script>

</body>
</html>
