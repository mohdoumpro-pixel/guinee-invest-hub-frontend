<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #17251c;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      color: #087f3e;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #087f3e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #066832;
    }

    .secondary {
      background: #333;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    #userBox {
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🇬🇳 Guinée Invest Hub</h1>

    <p class="subtitle">
      La plateforme qui connecte les investisseurs aux projets guinéens.
    </p>

    <!-- CONNEXION / INSCRIPTION -->

    <div id="authBox">

      <h2>Créer un compte</h2>

      <input
        id="email"
        type="email"
        placeholder="Votre adresse e-mail"
      >

      <input
        id="password"
        type="password"
        placeholder="Votre mot de passe"
      >

      <button
        id="signupBtn"
        type="button"
        onclick="creerCompte()"
      >
        Créer un compte
      </button>

      <button
        id="loginBtn"
        type="button"
        onclick="connecterCompte()"
        class="secondary"
      >
        Se connecter
      </button>

    </div>


    <!-- UTILISATEUR CONNECTÉ -->

    <div id="userBox">

      <h2>Bienvenue 👋</h2>

      <p id="userEmail"></p>

      <button
        type="button"
        onclick="deconnecter()"
        class="secondary"
      >
        Se déconnecter
      </button>

    </div>


    <p id="message"></p>

  </div>


  <script>

    // ==============================
    // SUPABASE
    // ==============================

    const SUPABASE_URL =
      "https://phwnkvglvebbajixwjau.supabase.co";

    const SUPABASE_KEY =
      sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // MESSAGE
    // ==============================

    function afficherMessage(texte) {

      document.getElementById("message").textContent = texte;

    }


    // ==============================
    // CREER UN COMPTE
    // ==============================

    async function creerCompte() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        afficherMessage(
          "⚠️ Remplis tous les champs."
        );

        return;
      }


      if (password.length < 6) {

        afficherMessage(
          "⚠️ Le mot de passe doit contenir au moins 6 caractères."
        );

        return;
      }


      afficherMessage(
        "⏳ Création du compte..."
      );


      try {

        const result =
          await supabaseClient.auth.signUp({

            email: email,

            password: password

          });


        const data = result.data;
        const error = result.error;


        if (error) {

          afficherMessage(
            "❌ " + error.message
          );

          return;
        }


        if (data && data.user) {

          afficherMessage(
            "✅ Compte créé avec succès !"
          );

          document.getElementById("email").value = "";

          document.getElementById("password").value = "";

        }

      } catch (error) {

        afficherMessage(
          "❌ Erreur : " + error.message
        );

      }

    }


    // ==============================
    // CONNEXION
    // ==============================

    async function connecterCompte() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        afficherMessage(
          "⚠️ Remplis tous les champs."
        );

        return;
      }


      afficherMessage(
        "⏳ Connexion..."
      );


      try {

        const result =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        const data = result.data;
        const error = result.error;


        if (error) {

          afficherMessage(
            "❌ " + error.message
          );

          return;
        }


        afficherMessage(
          "✅ Connexion réussie !"
        );


        afficherUtilisateur(
          data.user
        );


      } catch (error) {

        afficherMessage(
          "❌ Erreur : " + error.message
        );

      }

    }


    // ==============================
    // AFFICHER UTILISATEUR
    // ==============================

    function afficherUtilisateur(user) {

      if (!user) {

        document.getElementById("authBox").style.display =
          "block";

        document.getElementById("userBox").style.display =
          "none";

        return;

      }


      document.getElementById("authBox").style.display =
        "none";

      document.getElementById("userBox").style.display =
        "block";


      document.getElementById("userEmail").textContent =
        "Connecté avec : " + user.email;

    }


    // ==============================
    // DECONNEXION
    // ==============================

    async function deconnecter() {

      await supabaseClient.auth.signOut();

      document.getElementById("authBox").style.display =
        "block";

      document.getElementById("userBox").style.display =
        "none";

      afficherMessage(
        "✅ Vous êtes déconnecté."
      );

    }


    // ==============================
    // VERIFIER LA SESSION
    // ==============================

    async function verifierSession() {

      try {

        const result =
          await supabaseClient.auth.getSession();


        if (result.data && result.data.session) {

          afficherUtilisateur(
            result.data.session.user
          );

        }

      } catch (error) {

        console.log(error);

      }

    }


    verifierSession();

  </script>

</body>
</html>
