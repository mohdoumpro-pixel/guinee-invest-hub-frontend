<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      margin: 0;
      padding: 30px;
      text-align: center;
    }

    .box {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    input {
      width: 90%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 95%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: #0b7a4b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #095f3b;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    #userArea {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🇬🇳 Guinée Invest Hub</h1>

    <h2>Créer un compte / Se connecter</h2>

    <div id="authArea">

      <input
        type="email"
        id="email"
        placeholder="Votre adresse email"
      >

      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
      >

      <button type="button" id="signupBtn">
        Créer un compte
      </button>

      <button type="button" id="loginBtn">
        Se connecter
      </button>

      <div id="message"></div>

    </div>

    <div id="userArea">
      <h2>Bienvenue 👋</h2>
      <p id="userEmail"></p>
      <button type="button" id="logoutBtn">
        Se déconnecter
      </button>
    </div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://phwnkvglvebbajixwjau.supabase.co";

    const SUPABASE_KEY =
  sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");

    const signupBtn = document.getElementById("signupBtn");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function showMessage(text) {
      message.textContent = text;
    }

    signupBtn.addEventListener("click", async function () {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("⚠️ Entre ton email et ton mot de passe.");
        return;
      }

      if (password.length < 6) {
        showMessage("⚠️ Le mot de passe doit avoir au moins 6 caractères.");
        return;
      }

      showMessage("⏳ Création du compte...");

      const { data, error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (error) {
        showMessage("❌ " + error.message);
        return;
      }

      if (data.user) {
        showMessage("✅ Compte créé avec succès !");
      }

    });

    loginBtn.addEventListener("click", async function () {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("⚠️ Entre ton email et ton mot de passe.");
        return;
      }

      showMessage("⏳ Connexion...");

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        showMessage("❌ " + error.message);
        return;
      }

      if (data.user) {
        showMessage("✅ Connexion réussie !");
        showUser(data.user);
      }

    });

    logoutBtn.addEventListener("click", async function () {

      await supabaseClient.auth.signOut();

      document.getElementById("authArea").style.display = "block";
      document.getElementById("userArea").style.display = "none";

    });

    function showUser(user) {

      document.getElementById("authArea").style.display = "none";
      document.getElementById("userArea").style.display = "block";
      document.getElementById("userEmail").textContent = user.email;

    }

    async function checkUser() {

      const { data } =
        await supabaseClient.auth.getUser();

      if (data.user) {
        showUser(data.user);
      }

    }

    checkUser();

  </script>

</body>
</html>
