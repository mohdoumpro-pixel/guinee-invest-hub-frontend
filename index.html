<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #17221b;
    }

    header {
      background: #0b6b3a;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      opacity: .9;
    }

    main {
      width: 94%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .hidden {
      display: none !important;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      margin: 5px 4px 5px 0;
    }

    .primary {
      background: #0b6b3a;
      color: white;
    }

    .secondary {
      background: #e8f2ec;
      color: #0b6b3a;
    }

    .danger {
      background: #c62828;
      color: white;
    }

    .projects-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .project {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.08);
      border: 1px solid #e8eee9;
    }

    .project h3 {
      margin: 12px 0;
      font-size: 21px;
    }

    .project p {
      color: #5c665f;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .sector {
      display: inline-block;
      background: #e8f2ec;
      color: #0b6b3a;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .amount {
      font-size: 20px;
      font-weight: bold;
      color: #0b6b3a;
      margin: 15px 0;
    }

    .interest {
      background: #0b6b3a;
      color: white;
      width: 100%;
    }

    .details {
      background: #f7faf8;
      border-radius: 12px;
      padding: 18px;
      margin-top: 15px;
      display: none;
    }

    .details.open {
      display: block;
    }

    .details-row {
      padding: 10px 0;
      border-bottom: 1px solid #e1e7e3;
    }

    .details-row:last-child {
      border-bottom: none;
    }

    .details-label {
      font-size: 13px;
      color: #6c756f;
      margin-bottom: 4px;
    }

    .details-value {
      font-weight: bold;
    }

    .message {
      padding: 14px;
      border-radius: 10px;
      margin: 15px 0;
      background: #e8f2ec;
      color: #0b6b3a;
    }

    .error-box {
      background: #ffebee;
      color: #b71c1c;
      padding: 18px;
      border-radius: 12px;
    }

    .empty {
      padding: 25px;
      text-align: center;
      color: #69736c;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .counter {
      background: #0b6b3a;
      color: white;
      padding: 8px 13px;
      border-radius: 20px;
      font-weight: bold;
    }

    .interest-item {
      background: #f7faf8;
      border-radius: 10px;
      padding: 15px;
      margin: 10px 0;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 23px;
      }

      main {
        width: 92%;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🇬🇳 Guinée Invest Hub</h1>
  <p>Investissez dans les projets guinéens</p>
</header>

<main>

  <!-- AUTHENTIFICATION -->
  <section id="authCard" class="card">

    <h2>🔐 Connexion</h2>

    <p style="margin:10px 0 15px;">
      Connectez-vous ou créez votre compte investisseur.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Votre adresse email"
    >

    <input
      id="password"
      type="password"
      placeholder="Votre mot de passe"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Se connecter
    </button>

    <button
      class="secondary"
      onclick="signup()"
    >
      Créer un compte
    </button>

    <div id="authMessage"></div>

  </section>


  <!-- ESPACE INVESTISSEUR -->
  <section
    id="investorSpace"
    class="hidden"
  >

    <div class="card">

      <div class="user-bar">

        <div>
          <h2>💰 Espace Investisseur</h2>

          <p id="userEmail">
            Connecté
          </p>
        </div>

        <div>

          <span class="counter">
            ❤️ Mes intérêts :
            <span id="interestCount">0</span>
          </span>

          <button
            class="danger"
            onclick="logout()"
          >
            Déconnexion
          </button>

        </div>

      </div>

    </div>


    <!-- PROJETS -->
    <section class="card">

      <div class="projects-header">

        <div>
          <h2>🚀 Projets disponibles</h2>

          <p>
            <span id="projectCount">0</span>
            projet(s) disponible(s)
          </p>
        </div>

        <input
          id="search"
          type="text"
          placeholder="🔎 Rechercher un projet..."
          style="max-width:300px;"
          oninput="searchProjects()"
        >

      </div>

      <div
        id="projects"
        class="projects-grid"
      >
        <p class="empty">
          Chargement des projets...
        </p>
      </div>

    </section>


    <!-- MES INTÉRÊTS -->
    <section class="card">

      <h2>❤️ Mes intérêts</h2>

      <div id="myInterests">
        <p class="empty">
          Chargement...
        </p>
      </div>

    </section>

  </section>

</main>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://phwnkvglvebbajixwjau.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK";

  const sb =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     VARIABLES
  ========================= */

  let currentUser = null;
  let projects = [];


  /* =========================
     OUTILS
  ========================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formatMoney(value) {

    const number =
      Number(value) || 0;

    return number.toLocaleString(
      "fr-FR"
    ) + " GNF";

  }


  function showMessage(
    message,
    type = "success"
  ) {

    const box =
      document.getElementById(
        "authMessage"
      );

    box.innerHTML =
      `<div class="message">${escapeHtml(message)}</div>`;

  }


  /* =========================
     INSCRIPTION
  ========================= */

  async function signup() {

    const email =
      document.getElementById(
        "email"
      ).value.trim();

    const password =
      document.getElementById(
        "password"
      ).value;

    if (!email || !password) {

      showMessage(
        "Veuillez remplir tous les champs.",
        "error"
      );

      return;
    }

    const {
      data,
      error
    } =
      await sb.auth.signUp({
        email,
        password
      });

    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }

    if (data.user) {

      await saveProfile(
        data.user.id
      );

      showMessage(
        "✅ Compte créé avec succès.",
        "success"
      );

    }

  }


  /* =========================
     CONNEXION
  ========================= */

  async function login() {

    const email =
      document.getElementById(
        "email"
      ).value.trim();

    const password =
      document.getElementById(
        "password"
      ).value;

    if (!email || !password) {

      showMessage(
        "Veuillez remplir tous les champs.",
        "error"
      );

      return;
    }

    const {
      data,
      error
    } =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }

    currentUser =
      data.user;

    await saveProfile(
      currentUser.id
    );

    await loadUser();

  }


  /* =========================
     PROFIL
  ========================= */

  async function saveProfile(
    userId
  ) {

    const {
      error
    } =
      await sb
        .from("profiles")
        .upsert({
          id: userId,
          role: "investor"
        });

    if (error) {

      console.error(
        "Erreur profil:",
        error
      );

    }

  }


  /* =========================
     UTILISATEUR
  ========================= */

  async function loadUser() {

    const {
      data,
      error
    } =
      await sb.auth.getUser();

    if (error) {

      console.error(error);

      return;
    }

    currentUser =
      data?.user || null;

    const authCard =
      document.getElementById(
        "authCard"
      );

    const investorSpace =
      document.getElementById(
        "investorSpace"
      );

    if (!currentUser) {

      authCard.classList.remove(
        "hidden"
      );

      investorSpace.classList.add(
        "hidden"
      );

      return;
    }

    authCard.classList.add(
      "hidden"
    );

    investorSpace.classList.remove(
      "hidden"
    );

    document.getElementById(
      "userEmail"
    ).textContent =
      "Connecté : " +
      currentUser.email;

    await loadProjects();

    await loadInterestCount();

    await loadMyInterests();

  }


  /* =========================
     PROJETS
  ========================= */

  async function loadProjects() {

    const container =
      document.getElementById(
        "projects"
      );

    container.innerHTML =
      "<p class='empty'>Chargement des projets...</p>";

    const {
      data,
      error
    } =
      await sb
        .from("projects")
        .select("*")
        .order(
          "title",
          {
            ascending: true
          }
        );

    if (error) {

      console.error(error);

      container.innerHTML = `
        <div class="error-box">
          <strong>❌ Erreur Supabase</strong>
          <br><br>
          ${escapeHtml(error.message)}
        </div>
      `;

      document.getElementById(
        "projectCount"
      ).textContent = "0";

      return;
    }

    projects =
      data || [];

    document.getElementById(
      "projectCount"
    ).textContent =
      projects.length;

    displayProjects(
      projects
    );

  }


  /* =========================
     AFFICHAGE PROJETS
  ========================= */

  function displayProjects(
    list
  ) {

    const container =
      document.getElementById(
        "projects"
      );

    if (!list || !list.length) {

      container.innerHTML =
        "<p class='empty'>Aucun projet disponible pour le moment.</p>";

      return;
    }

    container.innerHTML =
      list.map(
        project => {

          const amount =
            project.amount_required ??
            project.amount ??
            0;

          return `

            <article class="project">

              <span class="sector">
                ${escapeHtml(
                  project.sector ||
                  "Projet"
                )}
              </span>

              <h3>
                ${escapeHtml(
                  project.title ||
                  "Projet sans titre"
                )}
              </h3>

              <p>
                ${escapeHtml(
                  project.description ||
                  "Aucune description disponible."
                )}
              </p>

              <div class="amount">
                ${formatMoney(amount)}
              </div>

              <button
                class="secondary"
                onclick="toggleDetails('${project.id}')"
              >
                📋 Voir les détails
              </button>

              <button
                class="interest"
                onclick="registerInterest('${project.id}')"
              >
                ❤️ Je suis intéressé
              </button>

              <div
                id="details-${project.id}"
                class="details"
              >

                <div class="details-row">

                  <div class="details-label">
                    Projet
                  </div>

                  <div class="details-value">
                    ${escapeHtml(
                      project.title ||
                      "Projet"
                    )}
                  </div>

                </div>

                <div class="details-row">

                  <div class="details-label">
                    Secteur
                  </div>

                  <div class="details-value">
                    ${escapeHtml(
                      project.sector ||
                      "Non précisé"
                    )}
                  </div>

                </div>

                <div class="details-row">

                  <div class="details-label">
                    Description
                  </div>

                  <div class="details-value">
                    ${escapeHtml(
                      project.description ||
                      "Aucune description disponible."
                    )}
                  </div>

                </div>

                <div class="details-row">

                  <div class="details-label">
                    Montant recherché
                  </div>

                  <div class="details-value">
                    ${formatMoney(amount)}
                  </div>

                </div>

                <div class="details-row">

                  <div class="details-label">
                    Statut
                  </div>

                  <div class="details-value">
                    ${escapeHtml(
                      project.status ||
                      "Disponible"
                    )}
                  </div>

                </div>

                <button
                  class="interest"
                  onclick="registerInterest('${project.id}')"
                >
                  💰 Je veux investir dans ce projet
                </button>

              </div>

            </article>

          `;

        }
      ).join("");

  }


  /* =========================
     DÉTAILS
  ========================= */

  function toggleDetails(
    projectId
  ) {

    const details =
      document.getElementById(
        "details-" +
        projectId
      );

    if (!details) return;

    details.classList.toggle(
      "open"
    );

  }


  /* =========================
     RECHERCHE
  ========================= */

  function searchProjects() {

    const query =
      document.getElementById(
        "search"
      ).value
      .trim()
      .toLowerCase();

    if (!query) {

      displayProjects(
        projects
      );

      return;
    }

    const filtered =
      projects.filter(
        project => {

          const text = `

            ${project.title || ""}

            ${project.description || ""}

            ${project.sector || ""}

          `.toLowerCase();

          return text.includes(
            query
          );

        }
      );

    displayProjects(
      filtered
    );

  }


  /* =========================
     INTÉRÊT
  ========================= */

  async function registerInterest(
    projectId
  ) {

    if (!currentUser) {

      alert(
        "Vous devez être connecté."
      );

      return;
    }

    const project =
      projects.find(
        p =>
          p.id === projectId
      );

    if (!project) {

      alert(
        "Projet introuvable."
      );

      return;
    }

    const {
      data: existing,
      error: checkError
    } =
      await sb
        .from("interests")
        .select("id")
        .eq(
          "user_id",
          currentUser.id
        )
        .eq(
          "project_id",
          projectId
        )
        .maybeSingle();

    if (checkError) {

      alert(
        "Erreur lors de la vérification."
      );

      console.error(
        checkError
      );

      return;
    }

    if (existing) {

      alert(
        "Vous êtes déjà intéressé par ce projet."
      );

      return;
    }

    const {
      error
    } =
      await sb
        .from("interests")
        .insert({

          user_id:
            currentUser.id,

          project_id:
            projectId

        });

    if (error) {

      alert(
        "Impossible d'enregistrer votre intérêt."
      );

      console.error(
        error
      );

      return;
    }

    alert(
      "✅ Votre intérêt pour " +
      project.title +
      " a été enregistré."
    );

    await loadInterestCount();

    await loadMyInterests();

  }


  /* =========================
     COMPTEUR INTÉRÊTS
  ========================= */

  async function loadInterestCount() {

    if (!currentUser)
      return;

    const {
      count,
      error
    } =
      await sb
        .from("interests")
        .select(
          "*",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "user_id",
          currentUser.id
        );

    if (!error) {

      document.getElementById(
        "interestCount"
      ).textContent =
        count || 0;

    }

  }


  /* =========================
     MES INTÉRÊTS
  ========================= */

  async function loadMyInterests() {

    const container =
      document.getElementById(
        "myInterests"
      );

    if (!currentUser) {

      container.innerHTML =
        "<p class='empty'>Connectez-vous pour voir vos intérêts.</p>";

      return;
    }

    const {
      data,
      error
    } =
      await sb
        .from("interests")
        .select(
          "id, project_id, created_at"
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (error) {

      container.innerHTML =
        "<p class='empty'>Impossible de charger vos intérêts.</p>";

      console.error(
        error
      );

      return;
    }

    if (!data || !data.length) {

      container.innerHTML =
        "<p class='empty'>Vous n'avez encore aucun projet enregistré.</p>";

      return;
    }

    container.innerHTML =
      data.map(
        interest => {

          const project =
            projects.find(
              p =>
                p.id ===
                interest.project_id
            );

          return `

            <div class="interest-item">

              <strong>
                ${escapeHtml(
                  project?.title ||
                  "Projet"
                )}
              </strong>

              <br>

              <small>
                Intérêt enregistré le
                ${new Date(
                  interest.created_at
                ).toLocaleDateString(
                  "fr-FR"
                )}
              </small>

            </div>

          `;

        }
      ).join("");

  }


  /* =========================
     DÉCONNEXION
  ========================= */

  async function logout() {

    await sb.auth.signOut();

    currentUser = null;

    document.getElementById(
      "authCard"
    ).classList.remove(
      "hidden"
    );

    document.getElementById(
      "investorSpace"
    ).classList.add(
      "hidden"
    );

  }


  /* =========================
     AUTH LISTENER
  ========================= */

  sb.auth.onAuthStateChange(
    async (
      event,
      session
    ) => {

      currentUser =
        session?.user ||
        null;

      if (
        event ===
          "SIGNED_IN" ||
        event ===
          "SIGNED_OUT"
      ) {

        await loadUser();

      }

    }
  );


  /* =========================
     DÉMARRAGE
  ========================= */

  loadUser();

</script>

</body>
</html>
