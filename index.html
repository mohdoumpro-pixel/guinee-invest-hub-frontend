<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #17211d;
    }

    header {
      background: #087f5b;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    input, textarea, select {
      width: 100%;
      padding: 14px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      border: 0;
      border-radius: 10px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #333;
    }

    .danger {
      background: #c92a2a;
    }

    .role-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .project {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    #message {
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: #eef7f3;
    }
  </style>
</head>

<body>

<header>
  <h1>🇬🇳 Guinée Invest Hub</h1>
  <p>Investir en Guinée. Créer. Développer.</p>
</header>

<div class="container">

  <div id="message" class="hidden"></div>

  <!-- INSCRIPTION -->
  <div id="signupBox" class="card">
    <h2>Créer un compte</h2>

    <input id="signupEmail" type="email" placeholder="Votre email">
    <input id="signupPassword" type="password" placeholder="Votre mot de passe">

    <button onclick="signup()">Créer mon compte</button>
    <button class="secondary" onclick="showLogin()">J'ai déjà un compte</button>
  </div>

  <!-- CONNEXION -->
  <div id="loginBox" class="card hidden">
    <h2>Connexion</h2>

    <input id="loginEmail" type="email" placeholder="Votre email">
    <input id="loginPassword" type="password" placeholder="Votre mot de passe">

    <button onclick="login()">Se connecter</button>
    <button class="secondary" onclick="showSignup()">Créer un compte</button>
  </div>

  <!-- CHOIX DU PROFIL -->
  <div id="roleBox" class="card hidden">
    <h2>Bienvenue 🇬🇳</h2>
    <p>Choisissez votre profil :</p>

    <div class="role-buttons">
      <button onclick="saveRole('investisseur')">
        💰 Investisseur
      </button>

      <button onclick="saveRole('porteur')">
        🚀 Porteur de projet
      </button>
    </div>
  </div>

  <!-- TABLEAU DE BORD -->
  <div id="dashboard" class="card hidden">

    <h2>Tableau de bord</h2>

    <p id="welcome"></p>

    <button onclick="showProjects()">
      📋 Voir les projets
    </button>

    <button onclick="showAddProject()">
      ➕ Ajouter un projet
    </button>

    <button class="danger" onclick="logout()">
      Déconnexion
    </button>

  </div>

  <!-- PROJETS -->
  <div id="projectsBox" class="card hidden">

    <h2>📋 Projets disponibles</h2>

    <div id="projectsList">
      Chargement...
    </div>

    <button class="secondary" onclick="backDashboard()">
      Retour
    </button>

  </div>

  <!-- AJOUT PROJET -->
  <div id="addProjectBox" class="card hidden">

    <h2>➕ Ajouter un projet</h2>

    <input id="projectTitle" placeholder="Nom du projet">

    <textarea id="projectDescription"
      placeholder="Description du projet"></textarea>

    <input id="projectSector"
      placeholder="Secteur (agriculture, immobilier...)">

    <button onclick="addProject()">
      Publier le projet
    </button>

    <button class="secondary" onclick="backDashboard()">
      Retour
    </button>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://phwnkvglvebbajixwjau.supabase.co";

/*
  ⚠️ REMPLACE UNIQUEMENT LA VALEUR CI-DESSOUS
  par ta clé Publishable Supabase.
*/

const SUPABASE_KEY =
sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* MESSAGE */

function message(text) {
  const box = document.getElementById("message");

  box.textContent = text;
  box.classList.remove("hidden");

  setTimeout(() => {
    box.classList.add("hidden");
  }, 5000);
}


/* AFFICHAGE */

function hideAll() {
  document.getElementById("signupBox").classList.add("hidden");
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("roleBox").classList.add("hidden");
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("projectsBox").classList.add("hidden");
  document.getElementById("addProjectBox").classList.add("hidden");
}


function showSignup() {
  hideAll();
  document.getElementById("signupBox").classList.remove("hidden");
}


function showLogin() {
  hideAll();
  document.getElementById("loginBox").classList.remove("hidden");
}


/* INSCRIPTION */

async function signup() {

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  if (!email || !password) {
    message("❌ Remplis tous les champs.");
    return;
  }

  if (password.length < 6) {
    message("❌ Le mot de passe doit avoir au moins 6 caractères.");
    return;
  }

  message("⏳ Création du compte...");

  const { data, error } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

  if (error) {
    message("❌ " + error.message);
    return;
  }

  message("✅ Compte créé avec succès !");

  if (data.user) {
    hideAll();
    document.getElementById("roleBox").classList.remove("hidden");
  }
}


/* CONNEXION */

async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!email || !password) {
    message("❌ Remplis tous les champs.");
    return;
  }

  message("⏳ Connexion...");

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    message("❌ " + error.message);
    return;
  }

  message("✅ Connexion réussie.");

  await checkProfile();
}


/* PROFIL */

async function saveRole(role) {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    message("❌ Utilisateur non connecté.");
    return;
  }

  const { error } =
    await supabaseClient
      .from("profiles")
      .upsert({
        id: user.id,
        role: role
      });

  if (error) {
    message("❌ " + error.message);
    return;
  }

  showDashboard(user, role);
}


/* PROFIL EXISTANT */

async function checkProfile() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    showLogin();
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .maybeSingle();

  if (error) {
    message("❌ " + error.message);
    return;
  }

  if (!data) {
    hideAll();
    document.getElementById("roleBox").classList.remove("hidden");
    return;
  }

  showDashboard(user, data.role);
}


/* DASHBOARD */

function showDashboard(user, role) {

  hideAll();

  document.getElementById("dashboard")
    .classList.remove("hidden");

  document.getElementById("welcome").textContent =
    "Bienvenue " + user.email + " — Profil : " + role;
}


/* PROJETS */

async function showProjects() {

  hideAll();

  document.getElementById("projectsBox")
    .classList.remove("hidden");

  const list =
    document.getElementById("projectsList");

  list.textContent = "Chargement...";

  const { data, error } =
    await supabaseClient
      .from("projects")
      .select("*");

  if (error) {
    list.textContent = "❌ " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.textContent = "Aucun projet pour le moment.";
    return;
  }

  list.innerHTML = "";

  data.forEach(project => {

    const div =
      document.createElement("div");

    div.className = "project";

    div.innerHTML = `
      <h3>${escapeHTML(project.title || "Sans titre")}</h3>
      <p>${escapeHTML(project.description || "")}</p>
      <strong>Secteur :</strong>
      ${escapeHTML(project.sector || "Non indiqué")}
    `;

    list.appendChild(div);
  });
}


/* AJOUT PROJET */

function showAddProject() {

  hideAll();

  document.getElementById("addProjectBox")
    .classList.remove("hidden");
}


async function addProject() {

  const title =
    document.getElementById("projectTitle").value.trim();

  const description =
    document.getElementById("projectDescription").value.trim();

  const sector =
    document.getElementById("projectSector").value.trim();

  if (!title) {
    message("❌ Donne un nom au projet.");
    return;
  }

  const { error } =
    await supabaseClient
      .from("projects")
      .insert({
        id: crypto.randomUUID(),
        title: title,
        description: description,
        sector: sector
      });

  if (error) {
    message("❌ " + error.message);
    return;
  }

  message("✅ Projet publié.");

  document.getElementById("projectTitle").value = "";
  document.getElementById("projectDescription").value = "";
  document.getElementById("projectSector").value = "";

  showProjects();
}


/* RETOUR */

function backDashboard() {
  supabaseClient.auth.getUser().then(({ data }) => {

    if (data.user) {
      showDashboard(data.user, "utilisateur");
    }

  });
}


/* DÉCONNEXION */

async function logout() {

  await supabaseClient.auth.signOut();

  message("👋 Déconnexion réussie.");

  showLogin();
}


/* SÉCURITÉ TEXTE */

function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* SESSION AU CHARGEMENT */

async function start() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {
    await checkProfile();
  } else {
    showSignup();
  }
}

start();

</script>

</body>
</html>
