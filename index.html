<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇬🇳 Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1, h2 {
      text-align: center;
    }

    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 7px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #16803c;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #333;
    }

    .hidden {
      display: none;
    }

    #message {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    .project {
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🇬🇳 Guinée Invest Hub</h1>

  <div id="message"></div>

  <!-- INSCRIPTION -->
  <div id="signupBox">
    <h2>Créer un compte</h2>

    <input
      id="signupEmail"
      type="email"
      placeholder="Votre email"
    >

    <input
      id="signupPassword"
      type="password"
      placeholder="Votre mot de passe"
    >

    <button onclick="signup()">
      Créer mon compte
    </button>

    <button class="secondary" onclick="showLogin()">
      J'ai déjà un compte
    </button>
  </div>

  <!-- CONNEXION -->
  <div id="loginBox" class="hidden">
    <h2>Connexion</h2>

    <input
      id="loginEmail"
      type="email"
      placeholder="Votre email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Votre mot de passe"
    >

    <button onclick="login()">
      Se connecter
    </button>

    <button class="secondary" onclick="showSignup()">
      Créer un compte
    </button>
  </div>

  <!-- CHOIX DU PROFIL -->
  <div id="roleBox" class="hidden">
    <h2>Choisissez votre profil</h2>

    <button onclick="saveRole('investisseur')">
      💰 Investisseur
    </button>

    <button onclick="saveRole('porteur de projet')">
      🚀 Porteur de projet
    </button>
  </div>

  <!-- TABLEAU DE BORD -->
  <div id="dashboard" class="hidden">
    <h2>Bienvenue 🇬🇳</h2>

    <button onclick="showProjects()">
      📊 Voir les projets
    </button>

    <button onclick="showAddProject()">
      ➕ Ajouter un projet
    </button>

    <button class="secondary" onclick="logout()">
      Déconnexion
    </button>
  </div>

  <!-- PROJETS -->
  <div id="projectsBox" class="hidden">
    <h2>Projets</h2>

    <div id="projectsList">
      Chargement...
    </div>

    <button class="secondary" onclick="backDashboard()">
      Retour
    </button>
  </div>

  <!-- AJOUT PROJET -->
  <div id="addProjectBox" class="hidden">
    <h2>Ajouter un projet</h2>

    <input
      id="projectTitle"
      type="text"
      placeholder="Titre du projet"
    >

    <textarea
      id="projectDescription"
      placeholder="Description du projet"
    ></textarea>

    <input
      id="projectSector"
      type="text"
      placeholder="Secteur"
    >

    <button onclick="addProject()">
      Publier le projet
    </button>

    <button class="secondary" onclick="backDashboard()">
      Retour
    </button>
  </div>

</div>

<script>

const SUPABASE_URL =
"https://phwnkvglvebbajixwjau.supabase.co";

/*
  ⚠️ REMPLACE SEULEMENT CETTE VALEUR
  par ta vraie clé sb_publishable_...
*/
const SUPABASE_KEY =
sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


function message(text) {
  document.getElementById("message").textContent = text;
}


function hideAll() {
  document.getElementById("signupBox").classList.add("hidden");
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("roleBox").classList.add("hidden");
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("projectsBox").classList.add("hidden");
  document.getElementById("addProjectBox").classList.add("hidden");
}


function showSignup() {
  hideAll();
  document.getElementById("signupBox").classList.remove("hidden");
}


function showLogin() {
  hideAll();
  document.getElementById("loginBox").classList.remove("hidden");
}


/* INSCRIPTION */
async function signup() {

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  if (!email || !password) {
    message("❌ Remplis tous les champs.");
    return;
  }

  if (password.length < 6) {
    message("❌ Mot de passe : minimum 6 caractères.");
    return;
  }

  message("⏳ Création du compte...");

  try {

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {
      message("❌ " + error.message);
      return;
    }

    message("✅ Compte créé avec succès !");

    if (data.user) {
      hideAll();
      document
        .getElementById("roleBox")
        .classList.remove("hidden");
    }

  } catch (error) {

    message("❌ Erreur : " + error.message);

  }
}


/* CONNEXION */
async function login() {

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!email || !password) {
    message("❌ Remplis tous les champs.");
    return;
  }

  message("⏳ Connexion...");

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      message("❌ " + error.message);
      return;
    }

    message("✅ Connexion réussie !");

    await checkProfile();

  } catch (error) {

    message("❌ Erreur : " + error.message);

  }
}


/* PROFIL */
async function saveRole(role) {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    message("❌ Utilisateur non connecté.");
    return;
  }

  message("⏳ Enregistrement du profil...");

  const { error } =
    await supabaseClient
      .from("profiles")
      .upsert({
        id: user.id,
        role: role
      });

  if (error) {
    message("❌ " + error.message);
    return;
  }

  message("✅ Profil enregistré !");

  hideAll();
  document
    .getElementById("dashboard")
    .classList.remove("hidden");
}


/* VÉRIFIER PROFIL */
async function checkProfile() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    showLogin();
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

  if (error) {
    message("❌ " + error.message);
    return;
  }

  hideAll();

  if (!data) {
    document
      .getElementById("roleBox")
      .classList.remove("hidden");
  } else {
    document
      .getElementById("dashboard")
      .classList.remove("hidden");
  }
}


/* AFFICHER LES PROJETS */
async function showProjects() {

  hideAll();

  document
    .getElementById("projectsBox")
    .classList.remove("hidden");

  const list =
    document.getElementById("projectsList");

  list.innerHTML = "⏳ Chargement...";

  const { data, error } =
    await supabaseClient
      .from("projects")
      .select("*");

  if (error) {
    list.innerHTML =
      "❌ " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML =
      "Aucun projet pour le moment.";
    return;
  }

  list.innerHTML = "";

  data.forEach(project => {

    list.innerHTML += `
      <div class="project">
        <h3>${project.title || ""}</h3>
        <p>${project.description || ""}</p>
        <strong>${project.sector || ""}</strong>
      </div>
    `;

  });
}


/* AJOUTER UN PROJET */
async function addProject() {

  const title =
    document.getElementById("projectTitle")
      .value.trim();

  const description =
    document.getElementById("projectDescription")
      .value.trim();

  const sector =
    document.getElementById("projectSector")
      .value.trim();

  if (!title) {
    message("❌ Ajoute un titre.");
    return;
  }

  message("⏳ Publication...");

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    message("❌ Connecte-toi d'abord.");
    return;
  }

  const { error } =
    await supabaseClient
      .from("projects")
      .insert({
        id: crypto.randomUUID(),
        title: title,
        description: description,
        sector: sector
      });

  if (error) {
    message("❌ " + error.message);
    return;
  }

  message("✅ Projet publié !");

  document.getElementById("projectTitle").value = "";
  document.getElementById("projectDescription").value = "";
  document.getElementById("projectSector").value = "";

  showProjects();
}


/* AJOUT PROJET */
function showAddProject() {

  hideAll();

  document
    .getElementById("addProjectBox")
    .classList.remove("hidden");
}


/* RETOUR */
function backDashboard() {

  hideAll();

  document
    .getElementById("dashboard")
    .classList.remove("hidden");
}


/* DÉCONNEXION */
async function logout() {

  await supabaseClient.auth.signOut();

  message("✅ Déconnecté.");

  showLogin();
}


/* SESSION AU CHARGEMENT */
async function startApp() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {
    await checkProfile();
  } else {
    showSignup();
  }
}

startApp();

</script>

</body>
</html>
