<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guinée Invest Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #075b3a, #0b8a60);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .hidden {
      display: none !important;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #d8dee7;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      margin: 5px 0;
      background: #087f5b;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      background: #c62828;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .stat {
      background: #eef8f4;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: #087f5b;
      font-size: 28px;
      margin-top: 7px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .project {
      border: 1px solid #e0e5eb;
      border-radius: 14px;
      padding: 18px;
      background: white;
    }

    .project h3 {
      margin-top: 10px;
      color: #087f5b;
    }

    .sector {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #e8f5ef;
      color: #087f5b;
      font-size: 13px;
    }

    .amount {
      margin: 15px 0;
      font-size: 20px;
      font-weight: bold;
    }

    .interest {
      width: 100%;
      background: #f59f00;
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .success {
      display: block;
      background: #dff5e8;
      color: #146c43;
    }

    .error {
      display: block;
      background: #fde2e2;
      color: #a61e1e;
    }

    .empty {
      text-align: center;
      color: #697386;
      padding: 25px;
    }

    .interest-project {
      background: #f6faf8;
      border-left: 4px solid #087f5b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .error-box {
      background: #fff1f1;
      color: #a61e1e;
      padding: 15px;
      border-radius: 10px;
      word-break: break-word;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🇬🇳 Guinée Invest Hub</h1>
  <p>Connecter les investisseurs aux projets guinéens</p>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <!-- CONNEXION -->

  <div id="authCard" class="card">

    <h2>💰 Espace Investisseur</h2>

    <input
      id="email"
      type="email"
      placeholder="Votre adresse email"
    >

    <input
      id="password"
      type="password"
      placeholder="Votre mot de passe"
    >

    <button id="loginBtn">
      🔐 Se connecter
    </button>

    <button id="signupBtn">
      📝 Créer un compte
    </button>

  </div>


  <!-- ESPACE INVESTISSEUR -->

  <div id="investorSpace" class="hidden">

    <div class="card">

      <h2>💰 Espace Investisseur</h2>

      <p id="userEmail"></p>

      <button id="logoutBtn" class="logout">
        🚪 Se déconnecter
      </button>

    </div>


    <!-- STATISTIQUES -->

    <div class="card">

      <h2>📊 Tableau de bord</h2>

      <div class="stats">

        <div class="stat">
          Projets disponibles
          <strong id="projectCount">0</strong>
        </div>

        <div class="stat">
          Mes intérêts
          <strong id="interestCount">0</strong>
        </div>

      </div>

    </div>


    <!-- MES INTÉRÊTS -->

    <div class="card">

      <h2>❤️ Mes intérêts</h2>

      <div id="myInterests">
        <p class="empty">Chargement...</p>
      </div>

    </div>


    <!-- PROJETS -->

    <div class="card">

      <h2>🚀 Projets disponibles</h2>

      <input
        id="search"
        type="text"
        placeholder="🔎 Rechercher un projet..."
      >

      <div id="projects">
        <p class="empty">
          Chargement des projets...
        </p>
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://phwnkvglvebbajixwjau.supabase.co";

/*
   IMPORTANT :
   Mets ici ta vraie clé PUBLISHABLE.
   Pas la Secret Key.
*/

const SUPABASE_KEY =
  "sb_publishable_NnsdG_LLkZswoTm4nRohNA_XF-WFlOK";


const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let projects = [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type) {

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  setTimeout(() => {

    box.className = "message";

  }, 5000);
}


/* =====================================================
   ARGENT
===================================================== */

function formatMoney(value) {

  const number =
    Number(value || 0);

  return number.toLocaleString("fr-FR") + " GNF";
}


/* =====================================================
   CONNEXION
===================================================== */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if (!email || !password) {

    showMessage(
      "Veuillez remplir tous les champs.",
      "error"
    );

    return;
  }

  const { error } =
    await sb.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  showMessage(
    "✅ Connexion réussie.",
    "success"
  );
}


/* =====================================================
   CRÉATION COMPTE
===================================================== */

async function signup() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if (!email || !password) {

    showMessage(
      "Veuillez remplir tous les champs.",
      "error"
    );

    return;
  }

  const {
    data,
    error
  } =
    await sb.auth.signUp({
      email: email,
      password: password
    });

  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }

  if (data && data.user) {

    await sb
      .from("profiles")
      .upsert({
        id: data.user.id,
        role: "investor"
      });
  }

  showMessage(
    "✅ Compte créé avec succès.",
    "success"
  );
}


/* =====================================================
   UTILISATEUR
===================================================== */

async function loadUser() {

  const {
    data,
    error
  } =
    await sb.auth.getUser();

  if (error) {

    console.error(error);

    return;
  }

  currentUser =
    data?.user || null;

  const authCard =
    document.getElementById("authCard");

  const investorSpace =
    document.getElementById("investorSpace");


  if (!currentUser) {

    authCard.classList.remove("hidden");

    investorSpace.classList.add("hidden");

    return;
  }


  authCard.classList.add("hidden");

  investorSpace.classList.remove("hidden");


  document.getElementById(
    "userEmail"
  ).textContent =
    "Connecté : " +
    currentUser.email;


  await loadProjects();

  await loadInterestCount();

  await loadMyInterests();
}


/* =====================================================
   CHARGER LES PROJETS
===================================================== */

async function loadProjects() {

  const container =
    document.getElementById("projects");

  container.innerHTML =
    "<p class='empty'>Chargement des projets...</p>";


  /*
    IMPORTANT :
    Aucun filtre status ici.
    Tous les projets présents dans Supabase
    sont récupérés.
  */

  const {
    data,
    error
  } =
    await sb
      .from("projects")
      .select("*")
      .order(
        "title",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    container.innerHTML = `
      <div class="error-box">
        <strong>❌ Erreur Supabase</strong>
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    document.getElementById(
      "projectCount"
    ).textContent = "0";

    return;
  }


  projects =
    data || [];


  document.getElementById(
    "projectCount"
  ).textContent =
    projects.length;


  displayProjects(projects);
}


/* =====================================================
   PROJETS
===================================================== */

function displayProjects(list) {

  const container =
    document.getElementById("projects");


  if (!list || !list.length) {

    container.innerHTML =
      "<p class='empty'>Aucun projet disponible pour le moment.</p>";

    return;
  }


  container.innerHTML =
    list.map(project => {

      const amount =
        project.amount_required ??
        project.amount ??
        0;


      return `

        <div class="project">

          <span class="sector">
            ${escapeHtml(
              project.sector ||
              "Projet"
            )}
          </span>

          <h3>
            ${escapeHtml(
              project.title ||
              "Projet sans titre"
            )}
          </h3>

          <p>
            ${escapeHtml(
              project.description ||
              "Aucune description disponible."
            )}
          </p>

          <div class="amount">
            ${formatMoney(amount)}
          </div>

          <button
            class="interest"
            onclick="registerInterest('${project.id}')"
          >
            ❤️ Je suis intéressé
          </button>

        </div>

      `;

    }).join("");
}


/* =====================================================
   SÉCURISER LE TEXTE
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   INTÉRÊT
===================================================== */

async function registerInterest(projectId) {

  if (!currentUser) {

    showMessage(
      "Vous devez être connecté.",
      "error"
    );

    return;
  }


  const project =
    projects.find(
      p => p.id === projectId
    );


  if (!project) {

    showMessage(
      "Projet introuvable.",
      "error"
    );

    return;
  }


  const {
    data: existing,
    error: checkError
  } =
    await sb
      .from("interests")
      .select("id")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "project_id",
        projectId
      )
      .maybeSingle();


  if (checkError) {

    showMessage(
      checkError.message,
      "error"
    );

    return;
  }


  if (existing) {

    showMessage(
      "Vous êtes déjà intéressé par ce projet.",
      "success"
    );

    return;
  }


  const {
    error
  } =
    await sb
      .from("interests")
      .insert({
        user_id: currentUser.id,
        project_id: projectId
      });


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "✅ Votre intérêt a été enregistré.",
    "success"
  );


  await loadInterestCount();

  await loadMyInterests();
}


/* =====================================================
   COMPTE DES INTÉRÊTS
===================================================== */

async function loadInterestCount() {

  if (!currentUser) return;


  const {
    count,
    error
  } =
    await sb
      .from("interests")
      .select(
        "*",
        {
          count: "exact",
          head: true
        }
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if (!error) {

    document.getElementById(
      "interestCount"
    ).textContent =
      count || 0;
  }
}


/* =====================================================
   MES INTÉRÊTS
===================================================== */

async function loadMyInterests() {

  const container =
    document.getElementById("myInterests");


  if (!currentUser) {

    container.innerHTML =
      "<p class='empty'>Connectez-vous pour voir vos intérêts.</p>";

    return;
  }


  container.innerHTML =
    "<p class='empty'>Chargement...</p>";


  const {
    data,
    error
  } =
    await sb
      .from("interests")
      .select(
        "id,project_id,created_at"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    container.innerHTML = `
      <div class="error-box">
        ❌ ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if (!data || !data.length) {

    container.innerHTML =
      "<p class='empty'>Vous n'avez encore aucun projet dans vos intérêts.</p>";

    return;
  }


  container.innerHTML =
    data.map(item => {

      const project =
        projects.find(
          p => p.id === item.project_id
        );


      if (!project) {

        return `
          <div class="interest-project">
            <strong>Projet associé</strong>
            <p>Projet non disponible.</p>
          </div>
        `;
      }


      const amount =
        project.amount_required ??
        project.amount ??
        0;


      return `
        <div class="interest-project">

          <strong>
            ${escapeHtml(project.title)}
          </strong>

          <p>
            ${escapeHtml(
              project.sector ||
              "Projet"
            )}
          </p>

          <strong>
            ${formatMoney(amount)}
          </strong>

        </div>
      `;

    }).join("");
}


/* =====================================================
   RECHERCHE
===================================================== */

document
  .getElementById("search")
  .addEventListener(
    "input",
    function() {

      const search =
        this.value
          .toLowerCase()
          .trim();


      const filtered =
        projects.filter(project => {

          return (

            String(
              project.title || ""
            )
              .toLowerCase()
              .includes(search)

            ||

            String(
              project.description || ""
            )
              .toLowerCase()
              .includes(search)

            ||

            String(
              project.sector || ""
            )
              .toLowerCase()
              .includes(search)

          );

        });


      displayProjects(filtered);
    }
  );


/* =====================================================
   DÉCONNEXION
===================================================== */

async function logout() {

  const {
    error
  } =
    await sb.auth.signOut();


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Vous êtes déconnecté.",
    "success"
  );
}


/* =====================================================
   BOUTONS
===================================================== */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    login
  );


document
  .getElementById("signupBtn")
  .addEventListener(
    "click",
    signup
  );


document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    logout
  );


/* =====================================================
   AUTHENTIFICATION
===================================================== */

sb.auth.onAuthStateChange(
  async (event, session) => {

    currentUser =
      session?.user || null;

    if (
      event === "SIGNED_IN" ||
      event === "SIGNED_OUT"
    ) {

      await loadUser();
    }
  }
);


/* =====================================================
   DÉMARRAGE
===================================================== */

loadUser();

</script>

</body>
</html>
